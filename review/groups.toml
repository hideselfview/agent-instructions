# The groups of rules that `builds review` hands to one reviewer each.
#
# Every rule under rules/ and every rule under projects/*-rules/ is in exactly
# one group (`builds review groups` checks it, and so does builds' test). A
# group runs when at least one of its rules matches a changed path. Its
# reviewer reads the full body of every rule in the group, the project's
# always-loaded instructions (projects/<project>.md), the principles the group
# names, the diff and the landing's brief, and answers for every rule.
#
# name        the group's name, as `builds review` prints it
# question    the one design question the group's rules answer
# model       opus or sonnet
# rules       rule slugs (the file names without .md)
# principles  files under principles/ (without .md) the reviewer reads
# instructions  extra words for the reviewer, optional
# enumerate  true when the reviewer lists every site of the diff that `sites`
#             describes, one changed file per call, and judges each site
#             against every rule of the group (the file's new text around each
#             hunk is in the message)
# sites      what a site is, for an enumerate group: the end of "every site in
#             the diff that ..."
# project_facts true when the group also answers for the project facts that
#             every commit keeps (the spec moves with the commit, bae writes as
#             local), as one more verdict named project-facts

[[group]]
name = "reads"
question = "Does every read the diff adds or changes come from SQL and a plain live query, with Rust computing nothing the screen shows?"
model = "opus"
rules = ["reactive-screens-read-plain-live-queries"]
principles = []
enumerate = true
sites = "handles rows a query returned, in Rust, Swift or Kotlin: a filter, a pick (first, find, first(where:)), a membership test (contains, isSubset, a Set of ids), a length or emptiness test, a count, a sort, a group, a join, a map that drops rows, or a subscription taken once"

[[group]]
name = "data stays out of the UI"
question = "Does the UI only iterate and render, with fast values drawn by native views and every derived value coming from the data layer?"
model = "sonnet"
rules = [
  "ui-iterates-and-renders-nothing-more",
  "high-frequency-values-skip-observed-ui-state",
]
principles = []

[[group]]
name = "errors and wrong state"
question = "Does every failure reach whoever can act on it, with no default hiding it and no later pass repairing wrong state?"
model = "sonnet"
rules = [
  "never-mask-errors-with-defaults",
  "never-fill-in-arguments-with-zero-valued-defaults",
  "no-self-heal-make-state-correct-or-fail-loud",
  "report-bugs-without-crashing-crash-only-on-untrustworthy-state",
  "check-a-fact-once-where-it-can-break",
]
principles = []

[[group]]
name = "need and shape"
question = "Is the change needed, and does it have today's shape and nothing more?"
model = "sonnet"
rules = [
  "question-necessity-before-any-change",
  "yagni",
  "write-today-s-shape-not-tomorrow-s",
  "a-mechanism-must-be-load-bearing",
  "settle-edge-cases-from-the-facts-not-with-special-case-ui",
]
principles = ["question-necessity", "yagni"]

[[group]]
name = "duplication and types"
question = "Does the change reuse what exists and give each concept one type?"
model = "sonnet"
rules = [
  "don-t-duplicate-existing-logic",
  "don-t-create-duplicate-types",
  "compose-existing-primitives-before-adding-new-ones",
  "many-fields-none-together-means-a-missing-type",
  "enums",
]
principles = ["composable-primitives"]

[[group]]
name = "boundaries and dispatch"
question = "Does each piece of code sit in the module of its domain, receive what it needs, and fix its bug at the lowest level?"
model = "opus"
rules = [
  "structure-follows-the-domain-not-the-crate-boundary",
  "split-by-domain-not-topic",
  "dependency-injection",
  "dispatch-on-known-state-not-blind-search",
  "precondition-gates-belong-at-the-call-site",
  "fix-at-the-lowest-level-the-bug-allows",
]
principles = ["revealing-structure"]

[[group]]
name = "UI state flow"
question = "Does each piece of UI state have one owner and one access path, passed as a reactive handle and read where it is used?"
model = "sonnet"
rules = [
  "a-component-has-one-access-path-to-any-given-piece-of-state",
  "pass-reactive-handles-not-snapshots",
  "read-at-the-leaf-not-the-parent",
  "observable-mutate-on-the-state-not-the-view",
  "state-describes-what-is-not-what-should-happen",
]
principles = []

[[group]]
name = "UI commands and lifetimes"
question = "Do commands name the state they want, and do tasks, reducers and layouts stay predictable?"
model = "sonnet"
rules = [
  "set-state-don-t-toggle",
  "reducers-must-not-read-state-to-write-state",
  "task-cancellation-choose-by-trigger",
  "layout-stability-in-repeated-views",
  "no-swizzling-or-monkeypatching",
]
principles = []

[[group]]
name = "time and tests"
question = "Does code know instead of waiting, and does each test exercise the real unit without timers, animation or text recognition?"
model = "sonnet"
rules = [
  "no-timers-in-place-of-knowing",
  "never-re-implement-production-logic-in-tests-mocks-or-previews",
  "every-bug-fix-starts-with-a-failing-test",
  "android-shots-hold-the-clock",
  "windows-in-tests-never-animate",
  "no-text-recognition-in-tests",
]
principles = []

[[group]]
name = "words people read"
question = "Is every sentence a person reads plain, literal, active, said once, spelled as the product spells them and kept in every language, in app strings, notifications, errors, titles, commit messages, docs and the comments and doc comments in code?"
model = "sonnet"
rules = [
  "write-plain-literal-active-sentences",
  "ui-text-says-each-thing-once-in-gentle-plain-words",
  "no-dash-as-sentence-punctuation",
  "localization-stays-in-sync-with-ui",
  "bae-spells-its-words",
  "no-marketing-language-anywhere",
]
principles = []
enumerate = true
sites = "is a sentence a person reads: each string, comment, doc comment and documentation sentence the diff adds or changes"

[[group]]
name = "what a screen shows"
question = "Does the screen show only what means something, drawn by its own component, with no decoration and no real names?"
model = "sonnet"
rules = [
  "no-llm-slop-chips",
  "no-decorative-icons-or-emoji",
  "no-music-note-imagery",
  "no-real-artist-album-song-names-in-artifacts",
  "no-restyling-a-component-from-outside",
]
principles = ["drawing-screens", "design-to-implementation"]

[[group]]
name = "repo and commit"
question = "Does the commit hold only the product, with the spec edited, no transient notes, and the project's own facts kept?"
model = "sonnet"
rules = [
  "ship-the-fix-not-the-investigation",
  "no-transient-references-in-code-tests-or-notes",
  "documentation-describes-current-state-transitions-go-in-plans",
  "use-the-project-s-logger-for-real-logs",
  "the-repo-holds-the-product-not-development-s-ephemera",
  "a-commit-hook-formats-and-statically-checks-what-changed",
  "look-up-the-latest-version-when-adding-a-new-dependency",
  "filename-matches-a-real-type-inside",
]
principles = []
project_facts = true

[[group]]
name = "visible project rules"
question = "Does the change follow the rules of the visible project?"
model = "sonnet"
rules = [
  "bridge-types-defined-in-rust",
  "greenfield-break-things",
  "ios-android-parity",
  "ui-and-bridge-thinness",
]
principles = []
