name: rules review (matrix, reusable)

# Reusable per-rule matrix reviewer. Replaces the old single-pass reviewer,
# which was bimodal/unreliable (engaged a rule or skipped it, ~coin-flip).
#
# The `discover` job derives the rule set from each rule's `paths` frontmatter:
# a rule runs when one of its globs matches a tracked file in the caller's repo
# (the universe is rules/ plus the caller's projects/<project>-rules/). Callers
# don't opt in — they get every applicable rule, and may drop one via `exclude`.
# Each matrix job then sees ONLY one rule's atomic file — rules/<slug>.md, or
# projects/<project>-rules/<slug>.md — plus the PR diff, and posts violations as
# inline comments.
#
# Reviewer: claude-code-action @51ea8ea7 (Claude Code 2.1.142), sonnet-4-6,
# violations schema. Rules read live from agent-instructions main.

on:
  workflow_call:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
        type: string
      checkout_ref:
        description: "caller ref to check out (PR head SHA)"
        required: true
        type: string
      project:
        description: "agent-instructions project name (for projects/<project>-rules/)"
        required: true
        type: string
      exclude:
        description: "JSON array of applicable rule slugs to skip (optional)"
        required: false
        default: "[]"
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  discover:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      slugs: ${{ steps.compute.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
      - uses: actions/checkout@v4
        with:
          repository: hideselfview/agent-instructions
          ref: main
          path: _ai
      - id: compute
        env:
          PROJECT: ${{ inputs.project }}
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          slugs=$(python3 _ai/scripts/rules_review/discover_rules.py \
            --rules-root _ai --consumer "$GITHUB_WORKSPACE" \
            --project "$PROJECT" --exclude "$EXCLUDE")
          echo "discovered: $slugs"
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"

  review:
    needs: discover
    if: needs.discover.outputs.slugs != '[]'
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJSON(needs.discover.outputs.slugs) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref }}
      - uses: actions/checkout@v4
        with:
          repository: hideselfview/agent-instructions
          ref: main
          path: _ai
      - name: Pick the one rule, delete the rest
        run: |
          slug="${{ matrix.slug }}"
          if [ -f "_ai/rules/$slug.md" ]; then
            cp "_ai/rules/$slug.md" "$GITHUB_WORKSPACE/THE_RULE.md"
          elif [ -f "_ai/projects/${{ inputs.project }}-rules/$slug.md" ]; then
            cp "_ai/projects/${{ inputs.project }}-rules/$slug.md" "$GITHUB_WORKSPACE/THE_RULE.md"
          else
            echo "no rule file for slug: $slug" >&2; exit 1
          fi
          rm -rf "$GITHUB_WORKSPACE/_ai"
          echo "=== THE_RULE.md ==="; cat "$GITHUB_WORKSPACE/THE_RULE.md"
      - id: claude
        uses: anthropics/claude-code-action@51ea8ea73a139f2a74ff649e3092c25a904aed7e
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","required":["violations"],"properties":{"violations":{"type":"array","items":{"type":"object","required":["blocking","path","line","body"],"properties":{"blocking":{"type":"boolean"},"path":{"type":"string"},"line":{"type":"integer"},"body":{"type":"string"}}}}}}'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ inputs.pr_number }}

            The ONLY rule you are enforcing is in the file ./THE_RULE.md.
            Read it — that is the complete and only rule. There are no other
            rules.

            Then read the PR diff (`gh pr diff $PR_NUMBER`) and flag every
            line-anchored violation of that one rule. Use Grep/Read across the
            repo if the rule needs cross-file context. Be exhaustive.

            Output structured findings as JSON matching the schema.

            For each violation, populate:
            - `blocking`: the value of the `blocking:` field in the rule's frontmatter.
            - `path`: file path as it appears in the diff.
            - `line`: line number in the new version of the file.
            - `body`: explanation of the violation.

            If no violations, output `{"violations": []}`.

      - name: Dump + post findings
        if: always()
        env:
          OUT: ${{ steps.claude.outputs.structured_output }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ inputs.checkout_ref }}
          PR: ${{ inputs.pr_number }}
          SLUG: ${{ matrix.slug }}
        run: |
          set -uo pipefail
          if [ -z "${OUT:-}" ]; then
            echo "RESULT slug=$SLUG ERROR no structured_output"; exit 0
          fi
          echo "RESULT slug=$SLUG count=$(jq '.violations | length' <<<"$OUT")"
          echo "OUTJSON slug=$SLUG :: $OUT"
          # Post each finding as an inline PR comment, tagged with the rule
          # slug so they're identifiable / bulk-closable. Non-fatal: a line
          # outside the diff yields a 422; skip and continue.
          jq -c '.violations[]' <<<"$OUT" | while read -r v; do
            jq -n --argjson v "$v" --arg sha "$SHA" --arg slug "$SLUG" \
              '{commit_id:$sha, path:$v.path, line:$v.line, side:"RIGHT",
                body:("**[rules-review: `" + $slug + "`]**\n\n" + $v.body)}' \
              | gh api -X POST "/repos/$REPO/pulls/$PR/comments" --input - >/dev/null \
              && echo "posted $SLUG @ $(jq -r .path <<<"$v"):$(jq -r .line <<<"$v")" \
              || echo "skip $SLUG @ $(jq -r .path <<<"$v"):$(jq -r .line <<<"$v") (line not in diff?)"
          done
