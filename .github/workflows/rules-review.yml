name: Rules review (reusable)

on:
  workflow_call:
    inputs:
      project:
        description: 'agent-instructions project name (matches projects/<name>.md). Defaults to the calling repo name; pass explicitly when the repo and project names differ (e.g., foragelang repo → forage project).'
        required: false
        type: string
        default: ${{ github.event.repository.name }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

jobs:
  review:
    if: github.event.pull_request.user.login == 'dminkovsky' || github.event.pull_request.user.login == 'hideselfview'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # Caller repo (the PR's code) into ./ so Claude can see the diff.
      - uses: actions/checkout@v4
      # Rules repo into ./agent-instructions/ so the prompt's paths resolve.
      - uses: actions/checkout@v4
        with:
          repository: hideselfview/agent-instructions
          path: agent-instructions
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*),Bash(touch:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            VIOLATION_MARKER: ${{ runner.temp }}/violations

            Check the PR diff for violations of the rules in:

            - agent-instructions/instructions-code.md (general code rules
              for code, tests, docs, commit messages, PR descriptions)
            - agent-instructions/rules/*.md (language and framework rules)
            - agent-instructions/projects/${{ inputs.project }}.md
              (project-specific rules; skip if the file doesn't exist)

            Read those files first, then review the diff.

            Each rule has a severity — blocking or informational. A
            rule is blocking if its body contains a `> Blocking`
            blockquote (anywhere within the rule's content, usually
            right after the heading). All other rules are
            informational.

            This is a rules check, not a code review. Do not critique
            design, suggest refactors, propose alternative approaches, or
            comment on architecture. Only flag concrete, citeable
            violations of the rules in the files above. If something is
            questionable but not a clear rule violation, skip it.

            Post findings through GitHub — do NOT put review text in your
            final message, since the action discards it. For each
            line-anchored violation, call
            `mcp__github_inline_comment__create_inline_comment` with
            `confirmed: true`; quote the specific rule the finding
            violates. Use `gh pr comment` only for violations that aren't
            line-anchored (e.g., commit message or PR description rules).

            After posting all comments, if any of the violations are
            on BLOCKING rules:

            - Run: `touch "$VIOLATION_MARKER"` (use the literal path
              substituted above).
            - Run: `gh pr review --request-changes --body "Blocking
              rule violations detected — see inline comments. Fix
              before merging."`

            If there are no violations, exit without posting anything.

      - name: Fail check if blocking violations were posted
        if: always()
        run: |
          if [ -f "${RUNNER_TEMP}/violations" ]; then
            echo "::error::Blocking rule violations found in PR diff — see inline comments and the request-changes review."
            exit 1
          fi
