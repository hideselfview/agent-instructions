name: Rules review (reusable)

on:
  workflow_call:
    inputs:
      project:
        description: "agent-instructions project name (matches projects/<name>.md). Defaults to the calling repo name; pass explicitly when the repo and project names differ (e.g., foragelang repo → forage project)."
        required: false
        type: string
        default: ${{ github.event.repository.name }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

concurrency:
  group: rules-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Author allowlist + skip non-base-change `edited` events. Callers
    # subscribe to `edited` to catch base-ref retargets (no native trigger
    # exists for that), but the same event also fires on title/description
    # edits — `github.event.changes.base` is the discriminator.
    if: |
      (github.event.pull_request.user.login == 'dminkovsky'
        || github.event.pull_request.user.login == 'hideselfview')
      && (github.event.action != 'edited'
        || github.event.changes.base != null)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # Skip review while prior bot comments are still unresolved.
      # Resolving them is the user's signal that the findings were
      # addressed (or accepted as known); only then does it make sense
      # to spend tokens on a fresh review and post a new round of
      # findings. Without this guard, every push posts duplicate
      # comments on top of unresolved ones.
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          REPO_OWNER="${REPO%/*}"
          REPO_NAME="${REPO#*/}"

          UNRESOLVED=$(gh api graphql -f query="
          {
            repository(owner: \"$REPO_OWNER\", name: \"$REPO_NAME\") {
              pullRequest(number: $PR_NUMBER) {
                reviewThreads(first: 100) {
                  nodes {
                    isResolved
                    comments(first: 1) {
                      nodes { author { login } }
                    }
                  }
                }
              }
            }
          }" --jq '[.data.repository.pullRequest.reviewThreads.nodes[]
            | select(.isResolved == false)
            | select(.comments.nodes[0].author.login == "github-actions")] | length')

          if [ "$UNRESOLVED" -gt 0 ]; then
            echo "::notice::Skipping review — $UNRESOLVED unresolved bot comment(s). Resolve them to trigger a fresh review."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # Caller repo (the PR's code) into ./ so Claude can see the diff.
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
      # Rules repo into ./agent-instructions/ so the prompt's paths resolve.
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: hideselfview/agent-instructions
          path: agent-instructions

      - if: steps.guard.outputs.skip != 'true'
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model claude-opus-4-7
            --allowedTools "Read,Glob,Grep,Bash(gh pr diff:*),Bash(gh pr view:*)"
            --json-schema '{"type":"object","required":["findings"],"properties":{"findings":{"type":"array","items":{"type":"object","required":["blocking","path","line","body"],"properties":{"blocking":{"type":"boolean"},"path":{"type":"string"},"line":{"type":"integer"},"body":{"type":"string"}}}}}}'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Read the rule files first:

            - agent-instructions/instructions-code.md (general code rules
              for code, tests, docs, commit messages, PR descriptions)
            - agent-instructions/rules/*.md (language and framework rules)
            - agent-instructions/projects/${{ inputs.project }}.md
              (project-specific rules; skip if the file doesn't exist)

            Each rule has a severity — blocking or informational. A
            rule is blocking if its body contains a `> Blocking`
            blockquote (anywhere within the rule's content, usually
            right after the heading). All other rules are
            informational.

            Then read the PR diff (`gh pr diff $PR_NUMBER`) and flag
            line-anchored violations of the rules loaded above. Stay
            concrete and citeable; if something is questionable but
            not clearly a rule violation, skip it. For rules that
            need cross-file context (e.g., "Don't duplicate existing
            logic"), use Grep/Read across the whole codebase, not
            just the changed files. Skip rules that apply to commit
            messages, PR descriptions, or other non-line-anchored
            content.

            Output structured findings as JSON matching the schema.
            Do NOT post anything via tools. The post-step will
            submit a single PR review with all your findings and
            request changes if any are blocking.

            For each finding, populate:
            - `blocking`: true if the violated rule has the `> Blocking`
              marker, false otherwise.
            - `path`: file path as it appears in the diff.
            - `line`: line number in the new version of the file.
            - `body`: write for someone who will spend 30 seconds
              reading. Lead with a one-line problem statement citing
              the rule by name and file (e.g. `Violates **"Never mask
              errors with defaults"** (instructions-code.md):` then
              the specific defect in 8–15 words). Bold the rule name.

              When the fix shape isn't obvious from the problem
              statement, add a "today" code fence (```rust / ```swift
              / etc.) showing the violating snippet from the diff and
              an "after" code fence showing the fix shape. Keep both
              blocks tight and parallel. Skip the fences when the fix
              is obvious from the problem statement (deleting a
              phrase, rewriting a comment, renaming an identifier) —
              code blocks add noise to trivial fixes.

              When the consequence of ignoring the rule isn't
              self-evident, end with one sentence on what breaks in
              this specific case (e.g. "every new platform has to
              relearn the URL trivia", "the silent skip hides a
              network failure from the user"). Not the rule text
              verbatim. Omit when self-evident.

              For cross-file findings, cite the existing file/symbol
              the diff duplicates or could share with in the problem
              statement.

              Coverage beats format. Surface every real finding, even
              when the body is just the one-line problem statement.
              A short finding is better than a missing one.

            If no findings, output `{"findings": []}`.

      - name: Post inline comments + summary review
        if: steps.claude.outputs.structured_output != ''
        env:
          # workflow's GITHUB_TOKEN — has the pull-requests: write
          # we declared on the job. Reviews + inline comments post as
          # github-actions[bot] rather than claude[bot], which is a
          # cosmetic difference. The action's own
          # steps.claude.outputs.github_token returned 401 from the
          # post-step against /pulls/{n}/comments and /pulls/{n}/reviews.
          GH_TOKEN: ${{ github.token }}
          FINDINGS: ${{ steps.claude.outputs.structured_output }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          total=$(jq '.findings | length' <<<"$FINDINGS")
          blocking=$(jq '[.findings[] | select(.blocking)] | length' <<<"$FINDINGS")
          informational=$((total - blocking))

          # Inline comments (only when findings exist).
          # NOTE: no de-dup against prior runs. We tried resolving stale
          # threads + skipping (path, line) duplicates via GraphQL, but
          # github-actions[bot] gets "Resource not accessible by
          # integration" on `resolveReviewThread`. Dedup would need a
          # PAT or GitHub App with broader scope.
          if [ "$total" -gt 0 ]; then
            jq -c '.findings[]' <<<"$FINDINGS" | while read -r v; do
              jq -n --argjson v "$v" --arg sha "$HEAD_SHA" \
                '{commit_id: $sha, path: $v.path, line: $v.line, side: "RIGHT", body: $v.body}' \
                | gh api -X POST "/repos/$REPO/pulls/$PR_NUMBER/comments" --input -
            done
          fi

          # Summary review. COMMENT (not APPROVE) when no blocking —
          # github-actions[bot] is forbidden from approving PRs (HTTP
          # 422 "GitHub Actions is not permitted to approve pull
          # requests"). To unblock merge when prior runs left a stale
          # REQUEST_CHANGES, we dismiss those reviews directly via the
          # dismissals endpoint (no approval permission needed).
          if [ "$blocking" -gt 0 ]; then
            event="REQUEST_CHANGES"
            summary="**$blocking blocking** finding(s), $informational informational — see inline comments. Blocking findings must be fixed before merging."
          elif [ "$total" -gt 0 ]; then
            event="COMMENT"
            summary="No blocking findings. $informational informational finding(s) — see inline comments."
          else
            event="COMMENT"
            summary="No findings."
          fi

          jq -n --arg sha "$HEAD_SHA" --arg event "$event" --arg body "$summary" \
            '{commit_id: $sha, event: $event, body: $body}' \
            | gh api -X POST "/repos/$REPO/pulls/$PR_NUMBER/reviews" --input -

          # Dismiss prior REQUEST_CHANGES reviews from this bot when
          # the new run has no blocking findings — the request was
          # addressed and shouldn't keep gating merge. Dismiss is a
          # different endpoint from review submission and doesn't trip
          # the "Actions can't approve" rule.
          if [ "$blocking" -eq 0 ]; then
            gh api "/repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate \
              --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "CHANGES_REQUESTED") | .id' \
              | while read -r rid; do
                gh api -X PUT "/repos/$REPO/pulls/$PR_NUMBER/reviews/$rid/dismissals" \
                  -f message="Superseded by a later run that found no blocking findings." \
                  >/dev/null \
                  || echo "warning: failed to dismiss review $rid"
              done
          fi

          if [ "$blocking" -gt 0 ]; then
            echo "::error::$blocking blocking finding(s) in PR diff."
            exit 1
          fi
