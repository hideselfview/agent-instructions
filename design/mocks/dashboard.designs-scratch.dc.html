<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard: a project's scratch boards</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/builds/tokens.css">
<link rel="stylesheet" href="ds/builds/components/bundle.css">
<script src="ds/builds/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0;background:var(--bg)}
.dz{display:flex;flex-direction:column;gap:16px;padding:20px 24px;font:400 14px var(--font-sans);color:var(--text)}
.dz-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.dz-head h1{margin:0;font:600 20px var(--font-sans)}
.dz-sub{color:var(--muted);font-size:13px}
.dz-sub code{font:500 12px var(--font-mono);color:var(--text-2)}
.dz-tools{margin-left:auto;display:flex;gap:8px;align-items:center}
.dz-row{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.dz-pages{flex:1 1 0;min-width:0;display:flex;gap:4px;flex-wrap:wrap}
.dz-filter{font:inherit;flex:none;width:240px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:5px 10px}
.dz-pages button{font:inherit;font-size:13px;color:var(--text-2);background:none;border:1px solid transparent;border-radius:6px;padding:3px 10px;cursor:pointer}
.dz-pages button[aria-selected="true"]{color:var(--text);border-color:var(--line);background:var(--surface)}
.dz-pages .n{color:var(--muted);margin-left:6px;font-size:12px}
.dz-sep{width:1px;align-self:stretch;background:var(--line);margin:2px 6px}
.dz-body{display:flex;gap:24px;align-items:flex-start}
.dz-main{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:24px}
.scratch{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.scratch a{color:var(--accent);font:500 13px var(--font-mono)}
</style></helmet>
<div class="dz">
<div class="dz-head">
  <h1>bae designs</h1>
  <span class="dz-sub">main at <code>43b9c69</code></span>
  <div class="dz-tools"><button type="button" class="qbtn">Publish to claude.ai…</button></div>
</div>
<div class="dz-row">
<div class="dz-pages" role="tablist" aria-label="Pages">
  <button type="button" role="tab" aria-selected="false">Design system</button>
  <button type="button" role="tab" aria-selected="true" id="scratch-tab">Scratch<span class="n">3</span></button>
  <span class="dz-sep" aria-hidden="true"></span>
  <button type="button" role="tab" aria-selected="false">Welcome<span class="n">71</span></button>
  <button type="button" role="tab" aria-selected="false">Home<span class="n">91</span></button>
  <button type="button" role="tab" aria-selected="false">Loading<span class="n">37</span></button>
  <button type="button" role="tab" aria-selected="false">Search<span class="n">7</span></button>
  <button type="button" role="tab" aria-selected="false">Import<span class="n">17</span></button>
  <button type="button" role="tab" aria-selected="false">Storage<span class="n">33</span></button>
  <button type="button" role="tab" aria-selected="false">Settings<span class="n">60</span></button>
  <button type="button" role="tab" aria-selected="false">Library<span class="n">178</span></button>
  <button type="button" role="tab" aria-selected="false">Logo<span class="n">13</span></button>
  <button type="button" role="tab" aria-selected="false">Explore<span class="n">34</span></button>
  <button type="button" role="tab" aria-selected="false">Shared<span class="n">16</span></button>
</div>
<input class="dz-filter" type="search" placeholder="Filter" aria-label="Filter">
</div>
<div class="dz-body"><div class="dz-main">
<ul class="scratch" id="scratch-list">
  <li><a href="#">scratch.welcome-libraries</a><span class="dz-sub"> in side-3</span></li>
  <li><a href="#">scratch.storage-band</a><span class="dz-sub"> in side-3</span></li>
  <li><a href="#">scratch.import-card</a><span class="dz-sub"> in side-7</span></li>
</ul>
</div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":480}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
