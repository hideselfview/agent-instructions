<script>
// A board is a tree of elements with {{name}} values, <sc-if>, <sc-for>,
// <dc-import> (another board, mounted here) and <x-import> (a design-system
// component, named with the namespace its bundle sets on window:
// Bae.MacButton is window.Bae.MacButton). Each board's own script is a class
// whose renderVals() gives the values its template reads.
class DCLogic { constructor(p) { this.props = p || {}; this.state = {}; } setState() {} }
var C = {};
@@CLASSES@@
var h = React.createElement;
function camel(s) { return s.replace(/-([a-z])/g, function (_, c) { return c.toUpperCase(); }); }
function look(sc, path) { return path.split('.').reduce(function (o, k) { return o == null ? undefined : o[k]; }, sc); }
function val(v, sc) {
  var m = /^\{\{\s*(.*?)\s*\}\}$/.exec(v);
  if (m) {
    if (m[1] === 'true') return true;
    if (m[1] === 'false') return false;
    return look(sc, m[1]);
  }
  return v.replace(/\{\{\s*([\w.$]+)\s*\}\}/g, function (_, k) { var x = look(sc, k); return x == null ? '' : x; });
}
function vals(name, props) {
  var c = new C[name](props);
  var v = c.renderVals() || {};
  if (!('yes' in v)) v.yes = true;
  return v;
}
function render(name, props, key) {
  var sc = vals(name, props);
  var t = document.getElementById('t-' + name).content;
  return h(React.Fragment, { key: key }, Array.prototype.map.call(t.childNodes, function (n, i) { return conv(n, i, sc); }));
}
function conv(n, key, sc) {
  if (n.nodeType === 3) return val(n.textContent, sc);
  if (n.nodeType !== 1) return null;
  var tag = n.tagName.toLowerCase();
  var kids = function () { return Array.prototype.map.call(n.childNodes, function (c, i) { return conv(c, i, sc); }); };
  if (tag === 'sc-if') return val(n.getAttribute('value'), sc) ? h(React.Fragment, { key: key }, kids()) : null;
  if (tag === 'sc-for') {
    var list = val(n.getAttribute('list'), sc) || [];
    var as = n.getAttribute('as');
    return h(React.Fragment, { key: key }, list.map(function (it, i) {
      var sc2 = Object.assign({}, sc);
      sc2[as] = it;
      sc2.$index = i;
      return h(React.Fragment, { key: i }, Array.prototype.map.call(n.childNodes, function (c, j) { return conv(c, j, sc2); }));
    }));
  }
  if (tag === 'dc-import') {
    var p = {};
    Array.prototype.forEach.call(n.attributes, function (a) {
      if (a.name === 'name' || a.name === 'hint-size') return;
      p[camel(a.name)] = val(a.value, sc);
    });
    return h(React.Fragment, { key: key }, render(n.getAttribute('name'), p));
  }
  var props = { key: key };
  if (tag === 'x-import') {
    Array.prototype.forEach.call(n.attributes, function (a) {
      if (a.name === 'component-from-global-scope') return;
      props[camel(a.name)] = val(a.value, sc);
    });
    var ref = n.getAttribute('component-from-global-scope');
    var dot = ref.indexOf('.');
    var ns = dot > 0 ? window[ref.slice(0, dot)] : undefined;
    var Cm = ns && ns[ref.slice(dot + 1)];
    if (!Cm) throw new Error('Could not find the component ' + ref + ' on window');
    var ck = props.key;
    delete props.key;
    return h('div', { key: ck, className: 'sc-host-x', style: { display: 'contents' } }, h.apply(null, [Cm, props].concat(kids())));
  }
  Array.prototype.forEach.call(n.attributes, function (a) {
    if (a.name === 'class') props.className = val(a.value, sc);
    else if (a.name === 'style') {
      var o = {};
      a.value.split(';').forEach(function (d) {
        var i = d.indexOf(':');
        if (i > 0) o[camel(d.slice(0, i).trim())] = d.slice(i + 1).trim();
      });
      props.style = o;
    } else props[a.name] = val(a.value, sc);
  });
  return h.apply(null, [tag, props].concat(kids()));
}
// The review page frames this page in a sandbox it cannot read, so it posts
// this page the CSS selectors of the elements it circles, and this page
// answers, once it has drawn, with what each selector finds (`foundBy`).
// `src` names this frame to the page.
var markDrawn;
var drawn = new Promise(function (resolve) { markDrawn = resolve; });
// The boxes, in board pixels, of the elements a person sees that <selector>
// finds on the board, or the error that stops it.
function foundBy(selector) {
  var all;
  try {
    all = document.getElementById('r').querySelectorAll(selector);
  } catch (error) {
    return { error: String(error && error.message || error) };
  }
  var boxes = [];
  Array.prototype.forEach.call(all, function (el) {
    var r = el.getBoundingClientRect();
    if (r.width < 1 || r.height < 1) return;
    boxes.push({ x: Math.round(r.left + window.scrollX), y: Math.round(r.top + window.scrollY), w: Math.round(r.width), h: Math.round(r.height) });
  });
  return { boxes: boxes };
}
window.addEventListener('message', function (e) {
  var asked = e.data && e.data.designCircles;
  if (e.source !== parent || !Array.isArray(asked)) return;
  drawn.then(function () {
    parent.postMessage({ designBoxes: { src: location.pathname, found: asked.map(function (s) { return s === null ? { boxes: [] } : foundBy(s); }) } }, '*');
  });
});
// The scratch view frames a board that is on no canvas, such as a scratch
// board, as wide as it has room for, and asks this page what size the board
// draws ({designSize: true}). This page answers, once it has drawn, with
// the width of the whole page and the height of what the board draws.
window.addEventListener('message', function (e) {
  if (e.source !== parent || !e.data || e.data.designSize !== true) return;
  drawn.then(function () {
    var r = document.getElementById('r');
    parent.postMessage({ designSize: {
      w: document.documentElement.scrollWidth,
      h: Math.max(1, Math.ceil(r.getBoundingClientRect().top + window.scrollY + r.scrollHeight)),
    } }, '*');
  });
});
// The board is drawn once React has drawn it and the fonts are in.
function Drawn(props) {
  React.useEffect(function () {
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(markDrawn);
  }, []);
  return props.children;
}
ReactDOM.createRoot(document.getElementById('r')).render(h(Drawn, null, render('__main__', {})));
</script>
