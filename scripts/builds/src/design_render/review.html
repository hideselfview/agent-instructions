<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design review</title>
<style>
:root { color-scheme: light dark; --bg: #f6f6f8; --fg: #1d1d22; --dim: #62626e; --line: #d4d4dc; --surface: #ffffff; --accent: #3a6df0; --bad: #c0392b; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0b10; --fg: #e4e4ea; --dim: #9a9aa8; --line: #2b2b36; --surface: #15151c; --accent: #7ea1ff; --bad: #ff7b6b; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
header h1 { margin: 0; font-size: 17px; font-weight: 650; }
header .id, header .repo, header .state { color: var(--dim); font-size: 13px; }
header .state.waiting { color: var(--accent); font-weight: 600; }
.tools { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--dim); font-size: 13px; }
.tools button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.tools button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
main { padding: 8px 20px 48px; }
section { margin-top: 28px; }
h2 { margin: 0 0 6px; font-size: 18px; }
.md { max-width: 1100px; }
.md p, .md ul { margin: 6px 0; }
.md code { font: 13px ui-monospace, Menlo, monospace; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.boards { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px; margin-top: 12px; }
figure { margin: 0; }
figcaption { margin-bottom: 6px; font-weight: 600; max-width: 700px; }
figcaption .meta { font-weight: 400; color: var(--dim); font-size: 12px; margin-left: 6px; }
figcaption a { color: var(--accent); font-weight: 400; font-size: 12px; margin-left: 6px; }
.frame { overflow: hidden; border: 1px solid var(--line); background: #000; }
.frame iframe { display: block; border: 0; background: transparent; transform-origin: 0 0; }
.problem { color: var(--bad); border: 1px solid var(--bad); border-radius: 6px; padding: 8px 12px; max-width: 700px; }
.work { max-width: 1100px; padding-left: 18px; }
.work li { margin: 3px 0; }
.work code { font: 13px ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1><span class="id" id="id"></span><span class="repo" id="repo"></span><span class="state" id="state"></span>
  <div class="tools" id="tools">Zoom
    <button type="button" data-zoom="fit" aria-pressed="true">Fit</button>
    <button type="button" data-zoom="0.5" aria-pressed="false">50%</button>
    <button type="button" data-zoom="0.75" aria-pressed="false">75%</button>
    <button type="button" data-zoom="1" aria-pressed="false">100%</button>
    <button type="button" data-zoom="1.5" aria-pressed="false">150%</button>
    <button type="button" data-zoom="2" aria-pressed="false">200%</button>
    <button type="button" id="reload">Redraw boards</button>
  </div>
</header>
<main id="main"></main>
<script type="application/json" id="data">@@DATA@@</script>
<script>
const data = JSON.parse(document.getElementById("data").textContent);
const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) el.setAttribute(k, v);
  el.append(...kids.flat(Infinity).filter(k => k !== null && k !== undefined));
  return el;
};
// `code` and **bold**, in text.
function inline(text) {
  const out = [];
  const re = /`([^`]+)`|\*\*(.+?)\*\*/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push(text.slice(last, m.index));
    out.push(m[1] !== undefined ? h("code", {}, m[1]) : h("strong", {}, inline(m[2])));
    last = re.lastIndex;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}
// Paragraphs and `-` lists.
function md(text) {
  const root = h("div", {class: "md"});
  let para = [], list = null;
  const endPara = () => { if (para.length) { root.append(h("p", {}, inline(para.join(" ")))); para = []; } };
  const endList = () => { if (list) { root.append(h("ul", {}, list.map(li => h("li", {}, inline(li.join(" ")))))); list = null; } };
  for (const raw of String(text).split("\n")) {
    const line = raw.trimEnd();
    const bullet = /^\s*[-*]\s+(.*)$/.exec(line);
    if (!line.trim()) { endPara(); endList(); }
    else if (bullet) { endPara(); (list = list || []).push([bullet[1]]); }
    else if (list && /^\s/.test(line)) list[list.length - 1].push(line.trim());
    else { endList(); para.push(line.trim()); }
  }
  endPara(); endList();
  return root;
}

document.title = data.title + " (design change #" + data.id + ")";
document.getElementById("title").textContent = data.title;
document.getElementById("id").textContent = "#" + data.id;
document.getElementById("repo").textContent = data.repo;
const state = document.getElementById("state");
state.textContent = data.approved ? "approved" : "waiting on your review";
if (!data.approved) state.classList.add("waiting");

// Each board is its rendered page in a frame, drawn at the size the canvas
// gives it and scaled; the frame stays live HTML, so zooming shows it sharp.
let zoom = "fit";
const frames = [];
function board(b) {
  const caption = h("figcaption", {}, b.caption, h("span", {class: "meta"}, b.theme),
    b.link ? h("a", {href: b.link, target: "_blank", rel: "noopener"}, "on the canvas") : null);
  if (b.error) return h("figure", {}, caption, h("div", {class: "problem"}, b.error));
  const frame = h("iframe", {src: b.src, sandbox: "allow-scripts", title: b.caption, width: b.w, height: b.h});
  const box = h("div", {class: "frame"}, frame);
  frames.push({b, frame, box});
  return h("figure", {}, caption, box);
}
function scaleOf(b) {
  if (zoom === "fit") return Math.min(1, (document.documentElement.clientWidth - 42) / b.w);
  return Number(zoom);
}
function layout() {
  for (const {b, frame, box} of frames) {
    const s = scaleOf(b);
    frame.style.transform = "scale(" + s + ")";
    box.style.width = Math.round(b.w * s) + "px";
    box.style.height = Math.round(b.h * s) + "px";
  }
}
const main = document.getElementById("main");
if (data.details.trim()) main.append(md(data.details));
for (const s of data.sections) {
  main.append(h("section", {}, h("h2", {}, s.heading), s.words.trim() ? md(s.words) : null,
    s.boards.length ? h("div", {class: "boards"}, s.boards.map(board)) : null));
}
if (data.places.length || data.no_app_place) {
  main.append(h("section", {}, h("h2", {}, "App work"),
    data.no_app_place ? md("No drawing changes: " + data.no_app_place) : null,
    h("ul", {class: "work"}, data.places.map(p => h("li", {}, h("code", {}, p.path), " ",
      p.item ? "item #" + p.item.id + " [" + p.item.state + "] " + p.item.title : "matches: " + p.matches)))));
}
document.getElementById("tools").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.id === "reload") {
    for (const {b: board, frame} of frames) frame.src = board.src + (board.src.includes("?") ? "&" : "?") + "t=" + Date.now();
    return;
  }
  zoom = b.dataset.zoom;
  for (const x of document.querySelectorAll("button[data-zoom]")) x.setAttribute("aria-pressed", String(x === b));
  layout();
});
window.addEventListener("resize", layout);
layout();
</script>
</body>
</html>
