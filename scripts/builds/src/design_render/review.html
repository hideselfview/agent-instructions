<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design review</title>
<style>
:root { color-scheme: light dark; --bg: #f6f6f8; --fg: #1d1d22; --dim: #62626e; --line: #d4d4dc; --surface: #ffffff; --accent: #3a6df0; --bad: #c0392b; }
@media (prefers-color-scheme: dark) { :root { --bg: #0b0b10; --fg: #e4e4ea; --dim: #9a9aa8; --line: #2b2b36; --surface: #15151c; --accent: #7ea1ff; --bad: #ff7b6b; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
header h1 { margin: 0; font-size: 17px; font-weight: 650; }
header .id, header .repo, header .state { color: var(--dim); font-size: 13px; }
header .state.waiting { color: var(--accent); font-weight: 600; }
header .approve { font: inherit; font-weight: 600; color: var(--bg); background: var(--accent); border: 1px solid var(--accent); border-radius: 6px; padding: 3px 14px; cursor: pointer; }
header .approve:disabled { opacity: 0.6; cursor: default; }
header .approval { color: var(--dim); font-size: 13px; }
header .approval.problem { color: var(--bad); border: 0; padding: 0; }
.tools { margin-left: auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--dim); font-size: 13px; }
.tools button { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.tools button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
main { padding: 8px 20px 48px; }
section { margin-top: 28px; }
h2 { margin: 0 0 6px; font-size: 18px; }
.md { max-width: 1100px; }
.md p, .md ul { margin: 6px 0; }
.md code { font: 13px ui-monospace, Menlo, monospace; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.boards { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px; margin-top: 12px; }
figure { margin: 0; }
figcaption { margin-bottom: 6px; font-weight: 600; max-width: 700px; }
figcaption .meta { font-weight: 400; color: var(--dim); font-size: 12px; margin-left: 6px; }
figcaption a { color: var(--accent); font-weight: 400; font-size: 12px; margin-left: 6px; }
.pair { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 16px; }
.side h3 { margin: 0 0 4px; font-size: 13px; font-weight: 600; color: var(--dim); }
.note { color: var(--dim); border: 1px dashed var(--line); border-radius: 6px; padding: 8px 12px; max-width: 700px; }
.frame { position: relative; overflow: hidden; border: 1px solid var(--line); background: #000; }
.hide-circles .circle { display: none; }
.circle { position: absolute; box-sizing: border-box; border: 2px solid #f5d90a; border-radius: 16px; pointer-events: auto; }
.status { margin: 0 0 6px; color: var(--dim); font-size: 13px; max-width: 700px; }
.status .bad { color: var(--bad); }
.problem { color: var(--bad); border: 1px solid var(--bad); border-radius: 6px; padding: 8px 12px; max-width: 700px; }
.work { max-width: 1100px; padding-left: 18px; }
.work li { margin: 3px 0; }
.work code { font: 13px ui-monospace, Menlo, monospace; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1><span class="id" id="id"></span><span class="repo" id="repo"></span><span class="state" id="state"></span>
  <span id="approve-here"></span><span class="approval" id="approval"></span>
  <div class="tools" id="tools">Zoom
    <button type="button" data-zoom="fit" aria-pressed="true">Fit</button>
    <button type="button" data-zoom="0.5" aria-pressed="false">50%</button>
    <button type="button" data-zoom="0.75" aria-pressed="false">75%</button>
    <button type="button" data-zoom="1" aria-pressed="false">100%</button>
    <button type="button" data-zoom="1.5" aria-pressed="false">150%</button>
    <button type="button" data-zoom="2" aria-pressed="false">200%</button>
    <button type="button" id="circles" aria-pressed="true">Circles</button>
    <button type="button" id="reload">Redraw boards</button>
  </div>
</header>
<main id="main"></main>
<script type="application/json" id="data">@@DATA@@</script>
<script>
@@CIRCLES@@
</script>
<script>
@@FRAMES@@
</script>
<script>
const data = JSON.parse(document.getElementById("data").textContent);
const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) el.setAttribute(k, v);
  el.append(...kids.flat(Infinity).filter(k => k !== null && k !== undefined));
  return el;
};
// `code` and **bold**, in text.
function inline(text) {
  const out = [];
  const re = /`([^`]+)`|\*\*(.+?)\*\*/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push(text.slice(last, m.index));
    out.push(m[1] !== undefined ? h("code", {}, m[1]) : h("strong", {}, inline(m[2])));
    last = re.lastIndex;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}
// Paragraphs and `-` lists.
function md(text) {
  const root = h("div", {class: "md"});
  let para = [], list = null;
  const endPara = () => { if (para.length) { root.append(h("p", {}, inline(para.join(" ")))); para = []; } };
  const endList = () => { if (list) { root.append(h("ul", {}, list.map(li => h("li", {}, inline(li.join(" ")))))); list = null; } };
  for (const raw of String(text).split("\n")) {
    const line = raw.trimEnd();
    const bullet = /^\s*[-*]\s+(.*)$/.exec(line);
    if (!line.trim()) { endPara(); endList(); }
    else if (bullet) { endPara(); (list = list || []).push([bullet[1]]); }
    else if (list && /^\s/.test(line)) list[list.length - 1].push(line.trim());
    else { endList(); para.push(line.trim()); }
  }
  endPara(); endList();
  return root;
}

document.title = data.title + " (design change #" + data.id + ")";
document.getElementById("title").textContent = data.title;
document.getElementById("id").textContent = "#" + data.id;
document.getElementById("repo").textContent = data.repo;
const state = document.getElementById("state");
// What the person and the session that recorded the change are told once it
// is approved. The Approve button works only on the page served at 127.0.0.1
// or localhost, and the daemon refuses an approval from anywhere else.
const here = ["127.0.0.1", "localhost", "[::1]"].includes(location.hostname);
const sessionWords = {
  unrecorded: "No session is recorded for this change, so the next design session lands it.",
  waiting: "",
  told: "The session that recorded it was told to land it.",
  ended: "The session that recorded it has ended, so the next design session lands it.",
};
const approvalLine = document.getElementById("approval");
function showApproval(problem) {
  state.textContent = data.approved ? "approved, waiting to land" : "waiting on your review";
  state.classList.toggle("waiting", !data.approved);
  const slot = document.getElementById("approve-here");
  slot.replaceChildren();
  approvalLine.classList.toggle("problem", !!problem);
  if (problem) { approvalLine.textContent = problem; return; }
  if (data.decision) { approvalLine.textContent = "The person decided the change in decision #" + data.decision.id + ", so it needs no review."; return; }
  if (data.approved) { approvalLine.textContent = sessionWords[data.session] || ""; return; }
  if (!here) { approvalLine.textContent = "Approval is only on this Mac."; return; }
  approvalLine.textContent = "";
  const button = h("button", {type: "button", class: "approve"}, "Approve");
  button.addEventListener("click", async () => {
    button.disabled = true;
    try {
      const response = await fetch(location.pathname.replace(/\/$/, "") + "/approve", {method: "POST"});
      const answer = await response.json();
      if (!response.ok) { showApproval(answer.error || "approving failed"); return; }
      data.approved = true;
      data.session = answer.session || data.session;
      showApproval();
    } catch (error) {
      showApproval("approving failed: " + error);
    }
  });
  slot.append(button);
}
showApproval();

// Each drawing is a rendered page in a frame, drawn at the size the canvas
// gives it and scaled (frames.js). A board shows its now and its proposed
// side by side, each with the design system of its own commit.
let zoom = "fit";
const frames = [];
function side(label, d, absent, pair, which) {
  const body = !d ? h("div", {class: "note"}, absent)
    : d.error ? h("div", {class: "problem"}, d.error)
    : d.absent ? h("div", {class: "note"}, absent)
    : drawn(d, pair, which);
  return h("div", {class: "side"}, h("h3", {}, label), body);
}
function drawn(d, pair, which) {
  const {frame, box} = boardFrame(d.src, d.w, d.h, false);
  const entry = {b: d, frame, box, circles: [], found: null};
  frames.push(entry);
  if (pair) {
    pair[which] = entry;
    entry.pair = pair;
    // Each load of the frame, the first and each redraw, asks its board page
    // what the designer's selectors find (board.html).
    if (pair.circles.length) frame.addEventListener("load", () => {
      entry.found = null;
      frame.contentWindow.postMessage({designCircles: pair.circles.map(c => c.selector)}, "*");
    });
  }
  return box;
}
// Each board page answers what the selectors find once it has drawn. When
// every drawing of a board has answered, the page circles what they found.
window.addEventListener("message", e => {
  const sent = e.data && e.data.designBoxes;
  if (!sent || !Array.isArray(sent.found)) return;
  const entry = frames.find(f => f.frame.contentWindow === e.source && f.b.src === sent.src);
  if (!entry || !entry.pair) return;
  entry.found = sent.found;
  settle(entry.pair);
});
function settle(pair) {
  const sides = [pair.now, pair.proposed].filter(Boolean);
  if (sides.some(entry => !entry.found)) return;
  const marks = circleMarks(pair.circles, pair.now ? pair.now.found : null, pair.proposed ? pair.proposed.found : null);
  for (const [entry, list] of [[pair.now, marks.now], [pair.proposed, marks.proposed]]) {
    if (!entry) continue;
    for (const c of entry.circles) c.el.remove();
    entry.circles = list.map(m => {
      const el = h("div", {class: "circle", title: m.title});
      entry.box.append(el);
      return {el, box: m.box};
    });
  }
  pair.problems.replaceChildren(...marks.problems.map(p => h("div", {class: "bad"}, p)));
  layout();
}
function board(b) {
  const caption = h("figcaption", {}, b.caption, h("span", {class: "meta"}, b.theme),
    b.link ? h("a", {href: b.link, target: "_blank", rel: "noopener"}, "on the canvas") : null);
  const isNew = b.now && b.now.absent;
  const labels = b.circles.map(c => c.label).filter(Boolean);
  const problems = h("div", {});
  const status = h("div", {class: "status"}, isNew ? "New board" : "",
    labels.length ? "Circled: " + labels.join("; ") : "", problems);
  const pair = {problems, circles: b.circles};
  const sides = h("div", {class: "pair"},
    side("Now (origin/main)", b.now, "This board is new: it has no now.", pair, "now"),
    side("Proposed (the change)", b.proposed, "", pair, "proposed"));
  return h("figure", {}, caption, status, sides);
}
function gone(d) {
  return h("figure", {}, h("figcaption", {}, h("code", {}, d.path)),
    h("div", {class: "pair"}, side("Now (origin/main)", d.now, "This board is not on origin/main."),
      h("div", {class: "side"}, h("h3", {}, "Proposed (the change)"), h("div", {class: "note"}, "The change deletes this board."))));
}
function scaleOf(b) {
  const room = (document.documentElement.clientWidth - 42 - 16) / 2;
  if (zoom === "fit") return Math.min(1, room / b.w);
  return Number(zoom);
}
function layout() {
  for (const entry of frames) {
    const {b, circles} = entry;
    const s = scaleOf(b);
    scaleFrame(entry, b.w, b.h, s);
    for (const {el, box} of circles) {
      // A circle stands 8 screen pixels clear of what it marks at any zoom,
      // so its line never covers the element.
      el.style.left = Math.round(box.x * s - 8) + "px";
      el.style.top = Math.round(box.y * s - 8) + "px";
      el.style.width = Math.round(box.w * s + 16) + "px";
      el.style.height = Math.round(box.h * s + 16) + "px";
    }
  }
}
const main = document.getElementById("main");
if (data.details.trim()) main.append(md(data.details));
if (data.section) {
  const s = data.section;
  main.append(h("section", {}, h("h2", {}, s.heading), s.words.trim() ? md(s.words) : null,
    s.boards.length ? h("div", {class: "boards"}, s.boards.map(board)) : null));
}
if (data.deleted.length) {
  main.append(h("section", {}, h("h2", {}, "Deleted boards"),
    h("div", {class: "boards"}, data.deleted.map(gone))));
}
if (data.places.length || data.no_app_place) {
  main.append(h("section", {}, h("h2", {}, "App work"),
    data.no_app_place ? md("No drawing changes: " + data.no_app_place) : null,
    h("ul", {class: "work"}, data.places.map(p => h("li", {}, h("code", {}, p.path), " ",
      p.item ? "item #" + p.item.id + " [" + p.item.state + "] " + p.item.title : "matches: " + p.matches)))));
}
document.getElementById("tools").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.id === "circles") {
    const on = document.body.classList.toggle("hide-circles");
    b.setAttribute("aria-pressed", String(!on));
    return;
  }
  if (b.id === "reload") {
    for (const {b: board, frame} of frames) frame.src = board.src + (board.src.includes("?") ? "&" : "?") + "t=" + Date.now();
    return;
  }
  zoom = b.dataset.zoom;
  for (const x of document.querySelectorAll("button[data-zoom]")) x.setAttribute("aria-pressed", String(x === b));
  layout();
});
window.addEventListener("resize", layout);
layout();
</script>
</body>
</html>
