<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scratch view</title>
<style>
@@FRAMES_CSS@@
header .where, header .state { color: var(--dim); font-size: 13px; }
header .where code { font: 12px ui-monospace, Menlo, monospace; }
header .state.bad { color: var(--bad); }
.tools .sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 4px; }
/* A redraw loads into a second frame over the first, hidden, and takes the
   first one's place once it has drawn. */
.frame iframe.loading { position: absolute; left: 0; top: 0; visibility: hidden; }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1><span class="where" id="where"></span><span class="where" id="absent"></span><span class="state" id="state"></span>
  <div class="tools" id="tools">
    <button type="button" data-theme="light" aria-pressed="false">Light</button>
    <button type="button" data-theme="dark" aria-pressed="false">Dark</button>
    <span class="sep"></span>Zoom
    <button type="button" data-zoom="fit" aria-pressed="true">Fit</button>
    <button type="button" data-zoom="0.5" aria-pressed="false">50%</button>
    <button type="button" data-zoom="0.75" aria-pressed="false">75%</button>
    <button type="button" data-zoom="1" aria-pressed="false">100%</button>
    <button type="button" data-zoom="1.5" aria-pressed="false">150%</button>
    <button type="button" data-zoom="2" aria-pressed="false">200%</button>
  </div>
</header>
<main><div class="pair" id="pair"></div></main>
<script type="application/json" id="data">@@DATA@@</script>
<script>
@@FRAMES@@
</script>
<script>
const data = JSON.parse(document.getElementById("data").textContent);
const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) el.setAttribute(k, v);
  el.append(...kids.flat(Infinity).filter(k => k !== null && k !== undefined));
  return el;
};

document.title = data.board + " (" + data.worktree + ", scratch)";
document.getElementById("title").textContent = data.board;
document.getElementById("where").append("drawn from the files of ", h("code", {}, data.top));
const state = document.getElementById("state");
function say(text, bad) {
  state.textContent = text;
  state.classList.toggle("bad", !!bad);
}

// The theme is in the address (?theme=light), so a reload keeps it.
let theme = new URLSearchParams(location.search).get("theme") === "light" ? "light" : "dark";
let zoom = "fit";
// The height a frame of a board on no canvas, such as a scratch board, lays
// the board out in before the board's page says what it draws.
const FIT_HEIGHT = 600;

// Each side is the board drawn in a frame at the size the canvas gives it,
// scaled (frames.js), or a note that says why it has no drawing. A board on
// no canvas (`fit`) is drawn as wide as the side has room for, and its frame
// then takes the size the board's page measures (board.html). A board that
// origin/main has no file of, as no scratch board has, shows its worktree's
// side alone. Each `drawing` event loads both frames again: the worktree's
// files may have changed, and origin/main may have moved since the last load.
// A redraw loads into a second frame, hidden, which takes the first one's
// place once it has drawn.
const sides = {
  now: {label: "Now (origin/main)"},
  worktree: {label: "The files of " + data.worktree},
};
const pair = document.getElementById("pair");
for (const side of Object.values(sides)) {
  side.body = h("div", {});
  side.el = h("div", {class: "side"}, h("h3", {}, side.label), side.body);
  side.box = null;
  side.shown = null;
  side.loading = null;
  pair.append(side.el);
}
let last = null;
// The width each side has room for.
function room() {
  const shown = Object.values(sides).filter(side => !side.el.hidden).length || 1;
  return Math.floor((document.documentElement.clientWidth - 42 - 16 * (shown - 1)) / shown);
}
function show(name, d) {
  const side = sides[name];
  side.el.hidden = !!d.absent;
  if (d.absent || d.error) {
    side.box = side.shown = side.loading = null;
    side.body.replaceChildren(...(d.error ? [h("div", {class: "problem"}, d.error)] : []));
    return;
  }
  const src = data.base + "/" + theme + "/" + name + "?t=" + Date.now();
  const fit = !!d.fit;
  const w = fit ? room() : d.w;
  const height = fit ? (side.shown && side.shown.fit ? side.shown.h : FIT_HEIGHT) : d.h;
  const made = boardFrame(src, w, height);
  const entry = {frame: made.frame, w, h: height, fit};
  // A redraw that has not drawn yet gives way to this one.
  if (side.loading) side.loading.frame.remove();
  side.loading = entry;
  made.frame.addEventListener("load", () => {
    if (fit) made.frame.contentWindow.postMessage({designSize: true}, "*");
    else ready(side, entry);
  });
  if (!side.box) {
    side.box = made.box;
    side.shown = null;
    side.body.replaceChildren(made.box);
  } else {
    made.frame.classList.add("loading");
    side.box.append(made.frame);
  }
}
// <entry>'s frame has drawn: it takes the place of the frame <side> shows.
function ready(side, entry) {
  if (side.loading !== entry) return;
  if (side.shown) side.shown.frame.remove();
  entry.frame.classList.remove("loading");
  side.shown = entry;
  side.loading = null;
  say("Drawn at " + new Date().toLocaleTimeString() + ".");
  layout();
}
// The page of a board on no canvas says the size it draws (board.html).
window.addEventListener("message", e => {
  const size = e.data && e.data.designSize;
  if (!size) return;
  for (const side of Object.values(sides)) {
    const entry = [side.loading, side.shown].find(x => x && x.fit && x.frame.contentWindow === e.source);
    if (!entry) continue;
    entry.w = size.w;
    entry.h = size.h;
    entry.frame.setAttribute("width", size.w);
    entry.frame.setAttribute("height", size.h);
    if (entry === side.loading) ready(side, entry);
    else layout();
  }
});
function draw() {
  if (!last) return;
  show("now", last.now);
  show("worktree", last.worktree);
  document.getElementById("absent").textContent = last.now.absent ? "origin/main has no file of this board." : "";
  layout();
}
function scaleOf(w) {
  return zoom === "fit" ? Math.min(1, room() / w) : Number(zoom);
}
function layout() {
  for (const side of Object.values(sides)) {
    const shown = side.shown || side.loading;
    if (!shown) continue;
    scaleFrame({frame: shown.frame, box: side.box}, shown.w, shown.h, scaleOf(shown.w));
    if (side.shown && side.loading) side.loading.frame.style.transform = "scale(" + scaleOf(side.loading.w) + ")";
  }
}

// The dashboard sends a `drawing` event when the page connects and after
// each change to the worktree's design files.
const events = new EventSource(data.base + "/events");
events.addEventListener("drawing", e => {
  last = JSON.parse(e.data);
  draw();
});
events.addEventListener("error", () => {
  if (events.readyState === EventSource.CLOSED) say("The dashboard refused the scratch view's events. Reload the page.", true);
  else say("The page lost the dashboard's events and connects again.", true);
});

function pressTheme() {
  for (const b of document.querySelectorAll("button[data-theme]")) b.setAttribute("aria-pressed", String(b.dataset.theme === theme));
}
pressTheme();
document.getElementById("tools").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.theme) {
    theme = b.dataset.theme;
    const query = new URLSearchParams(location.search);
    query.set("theme", theme);
    history.replaceState(null, "", "?" + query);
    pressTheme();
    draw();
    return;
  }
  zoom = b.dataset.zoom;
  for (const x of document.querySelectorAll("button[data-zoom]")) x.setAttribute("aria-pressed", String(x === b));
  layout();
});
window.addEventListener("resize", layout);
</script>
</body>
</html>
