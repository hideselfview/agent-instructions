<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Roboto:wght@400;500;600;700;800&display=swap">
<style>
@@PALETTE@@
@@CONTROLS@@
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
.dz { display: flex; flex-direction: column; gap: 16px; padding: 0 24px 48px; }
/* The toolbar (the heading line, and the tabs with the Filter field) stays at the top
   of the window while the page scrolls. --bar is its height, which the script
   sets, and the section headings stick just under it. */
.dz-bar { position: sticky; top: 0; z-index: 3; display: flex; flex-direction: column; gap: 12px; padding: 16px 0 0; background: var(--bg); }
.dz-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.dz-head h1 { margin: 0; font: 600 20px var(--sans); }
.dz-sub { color: var(--muted); font-size: 13px; }
.dz-tools { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.pub-now { color: var(--muted); }
.pub-now code, .bstatus code { font: 500 12px var(--mono); color: var(--text-2); }
.dz-sub code, .problem code { font: 500 12px var(--mono); color: var(--text-2); }
.dz-row { display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.dz-pages { flex: 1 1 0; min-width: 0; display: flex; gap: 4px; flex-wrap: wrap; }
.dz-pages button { font: inherit; font-size: 13px; color: var(--text-2); background: none; border: 1px solid transparent; border-radius: 6px; padding: 3px 10px; cursor: pointer; }
.dz-pages button[aria-selected="true"] { color: var(--text); border-color: var(--line); background: var(--surface); }
.dz-pages button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dz-pages .n { color: var(--muted); margin-left: 6px; font-size: 12px; }
.dz-sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 6px; }
.dz-view { position: relative; overflow: hidden; height: calc(100vh - 170px); min-height: 360px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); touch-action: none; cursor: grab; user-select: none; }
.dz-view.panning { cursor: grabbing; }
.dz-world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.dz-board { position: absolute; }
.dz-board .frame { width: 100%; height: 100%; border: 0; }
.dz-board iframe { pointer-events: none; }
.dz-board .dz-title { position: absolute; left: 0; top: 100%; margin-top: calc(6px / var(--k)); max-width: 100%; font-size: min(calc(13px / var(--k)), 48px); }
.dz-board .problem { position: absolute; inset: 0; overflow: hidden; }
.dz-zoom { position: absolute; right: 10px; bottom: 10px; display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 12px; cursor: default; }
.dz-title { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#main { display: flex; flex-direction: column; gap: 24px; }
.ds-sec { display: flex; flex-direction: column; gap: 10px; }
.ds-sec h2 { margin: 0; font: 600 15px var(--sans); }
.ds-swatches { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 12px; }
.ds-sw { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.ds-chip { height: 40px; border-radius: 6px; border: 1px solid var(--line); }
.ds-k { font: 500 11px var(--mono); color: var(--text-2); overflow-wrap: anywhere; }
.ds-type { display: flex; flex-direction: column; gap: 6px; }
.ds-type div { display: flex; align-items: baseline; gap: 16px; min-width: 0; }
.ds-type .ds-k { flex: none; width: 120px; }
[hidden] { display: none !important; }
.dz-filter { font: inherit; flex: none; width: 240px; max-width: 100%; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; }
.dz-filter:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.ds-groups { display: flex; flex-direction: column; gap: 32px; }
.ds-group { display: flex; flex-direction: column; gap: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
.ds-group > h3, .ds-sub > h4 { position: sticky; z-index: 2; margin: 0; background: var(--bg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ds-group > h3 { top: var(--bar, 0px); height: var(--h3, 32px); font: 600 18px/var(--h3, 32px) var(--sans); }
.ds-sub { display: flex; flex-direction: column; gap: 10px; }
.ds-sub > h4 { top: calc(var(--bar, 0px) + var(--h3, 32px)); height: 28px; font: 600 14px/28px var(--sans); }
.ds-about { margin: -6px 0 0; color: var(--muted); max-width: 760px; }
.ds-cards { display: flex; flex-wrap: wrap; gap: 20px 24px; align-items: flex-start; }
.ds-comp { flex: none; display: flex; flex-direction: column; gap: 6px; max-width: 100%; }
.ds-prev { display: block; width: 360px; max-width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.problem { color: var(--bad); background: var(--bad-bg); border-radius: 6px; padding: 8px 10px; font-size: 13px; overflow-wrap: anywhere; }
@media (max-width: 900px) { .ds-swatches { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 600px) { .dz { padding: 0 12px 32px; } .dz-bar { padding-top: 8px; gap: 8px; } .dz-pages { flex-wrap: nowrap; overflow-x: auto; } .dz-pages button { flex: none; white-space: nowrap; } }
.pub-links { display: flex; flex-direction: column; gap: 4px; color: var(--text-2); }
.scratch { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.scratch a { color: var(--accent); font: 500 13px var(--mono); }
.pub-links a { color: var(--accent); }
</style>
</head>
<body>
<div class="dz">
  <div class="dz-bar" id="bar">
    <div class="dz-head"><h1 id="title"></h1><span class="dz-sub" id="at"></span><span class="dz-sub" id="claude"></span><div class="dz-tools" id="tools"></div></div>
    <div class="dz-row">
      <div class="dz-pages" id="tabs" role="tablist" aria-label="Pages"></div>
      <input class="dz-filter" id="filter" type="search" placeholder="Filter" aria-label="Filter">
    </div>
  </div>
  <div id="main"></div>
</div>
<dialog class="lane-dlg" id="publish" aria-label="Publish to claude.ai">
  <div class="lm-head"><span class="lm-title" id="pub-title"></span><button type="button" id="pub-close">Close</button></div>
  <div class="lm-body" id="pub-body"></div>
</dialog>
<script type="application/json" id="data">@@DATA@@</script>
<script>
@@CONTROLS_JS@@
</script>
<script>
@@FRAMES@@
</script>
<script>
const data = JSON.parse(document.getElementById("data").textContent);
const h = (tag, attrs, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v !== null && v !== undefined) el.setAttribute(k, v);
  el.append(...kids.flat(Infinity).filter(k => k !== null && k !== undefined));
  return el;
};
document.title = data.project + " designs";
document.getElementById("title").textContent = data.project + " designs";
document.getElementById("at").append("main at ", h("code", {title: data.commit}, data.commit.slice(0, 7)));

// The tabs: the design system, the scratch boards on this Mac, then one per
// page of the canvas index. The chosen tab is in the address's #, so a reload
// keeps it.
const SYSTEM = "system", SCRATCH = "scratch";
function chosen() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (id === SYSTEM || (id === SCRATCH && data.scratch) || data.pages.some(p => p.id === id)) return id;
  return data.pages.length ? data.pages[0].id : SYSTEM;
}
function tab(id, label, count) {
  return h("button", {type: "button", role: "tab", "data-tab": id, "aria-selected": String(id === chosen())},
    label, count === undefined ? null : h("span", {class: "n"}, String(count)));
}
function renderTabs() {
  const scratch = data.scratch;
  document.getElementById("tabs").replaceChildren(tab(SYSTEM, "Design system"),
    ...(scratch ? [tab(SCRATCH, "Scratch", scratch.boards ? scratch.boards.length : undefined)] : []),
    h("span", {class: "dz-sep", "aria-hidden": "true"}),
    ...data.pages.map(p => tab(p.id, p.name, p.boards.length)));
}

// The boards of the chosen page on a canvas: each stands at the x, y, width
// and height the canvas index gives it, and the whole canvas scales and moves
// as the person pans (drag, scroll) and zooms (pinch, ctrl-scroll). A board's
// frame loads its page the first time the board comes into view. A board that
// the index gives no size or place shows as its problem above the canvas.
const MIN_ZOOM = 0.02, MAX_ZOOM = 4, FIT_MARGIN = 40;
function boardView(b) {
  const box = h("div", {class: "dz-board", style: "left: " + b.x + "px; top: " + b.y + "px; width: " + b.w + "px; height: " + b.h + "px"});
  const {frame, box: framed} = boardFrame(null, b.w, b.h);
  frame.setAttribute("title", b.name);
  box.append(framed, h("span", {class: "dz-title", title: b.name}, b.title || b.name));
  return {b, box, frame, loaded: false};
}
function canvasView(boards) {
  const view = h("div", {class: "dz-view", tabindex: "0", "aria-label": "Boards on the canvas"});
  const world = h("div", {class: "dz-world"});
  const fitButton = h("button", {type: "button", class: "qbtn"}, "Fit");
  const level = h("span", {});
  view.append(world, h("div", {class: "dz-zoom"}, level, fitButton));
  const placed = boards.map(boardView);
  world.append(...placed.map(p => p.box));
  let k = 1, x = 0, y = 0;
  function show() {
    world.style.transform = "translate(" + x + "px, " + y + "px) scale(" + k + ")";
    world.style.setProperty("--k", k);
    level.textContent = Math.round(k * 100) + "%";
    const w = view.clientWidth, hh = view.clientHeight;
    for (const p of placed) {
      if (p.loaded) continue;
      const left = p.b.x * k + x, top = p.b.y * k + y;
      if (left < w && top < hh && left + p.b.w * k > 0 && top + p.b.h * k > 0) {
        p.loaded = true;
        p.frame.setAttribute("src", data.base + "/board/" + encodeURIComponent(p.b.name));
      }
    }
  }
  function fit() {
    const w = view.clientWidth - 2 * FIT_MARGIN, hh = view.clientHeight - 2 * FIT_MARGIN;
    if (!placed.length || w <= 0 || hh <= 0) { k = 1; x = 0; y = 0; show(); return; }
    const left = Math.min(...placed.map(p => p.b.x)), top = Math.min(...placed.map(p => p.b.y));
    const right = Math.max(...placed.map(p => p.b.x + p.b.w)), bottom = Math.max(...placed.map(p => p.b.y + p.b.h));
    k = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, Math.min(w / (right - left), hh / (bottom - top))));
    x = FIT_MARGIN - left * k + (w - (right - left) * k) / 2;
    y = FIT_MARGIN - top * k;
    show();
  }
  // Zooms by <factor> about the point (<px>, <py>) of the view.
  function zoom(factor, px, py) {
    const next = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, k * factor));
    x = px - (px - x) * next / k;
    y = py - (py - y) * next / k;
    k = next;
    show();
  }
  view.addEventListener("wheel", e => {
    e.preventDefault();
    const r = view.getBoundingClientRect();
    if (e.ctrlKey) zoom(Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
    else { x -= e.deltaX; y -= e.deltaY; show(); }
  }, {passive: false});
  const touches = new Map();
  let pinch = null;
  view.addEventListener("pointerdown", e => {
    if (e.target.closest(".dz-zoom")) return;
    view.setPointerCapture(e.pointerId);
    touches.set(e.pointerId, {x: e.clientX, y: e.clientY});
    view.classList.add("panning");
    pinch = touches.size === 2 ? gap() : null;
  });
  const gap = () => { const [a, b] = [...touches.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  view.addEventListener("pointermove", e => {
    const last = touches.get(e.pointerId);
    if (!last) return;
    const now = {x: e.clientX, y: e.clientY};
    touches.set(e.pointerId, now);
    if (touches.size === 2) {
      const d = gap(), r = view.getBoundingClientRect(), [a, b] = [...touches.values()];
      if (pinch) zoom(d / pinch, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
      pinch = d;
    } else {
      x += now.x - last.x;
      y += now.y - last.y;
      show();
    }
  });
  const release = e => {
    touches.delete(e.pointerId);
    pinch = null;
    if (!touches.size) view.classList.remove("panning");
  };
  view.addEventListener("pointerup", release);
  view.addEventListener("pointercancel", release);
  fitButton.addEventListener("click", fit);
  view.addEventListener("dblclick", e => { if (!e.target.closest(".dz-zoom")) fit(); });
  // The first size the view gets, once it is in the page, fits the boards.
  let fitted = false;
  new ResizeObserver(() => {
    if (!fitted && view.clientWidth > 0 && view.clientHeight > 0) { fitted = true; fit(); }
    else show();
  }).observe(view);
  return view;
}
function pageView(page) {
  if (!page.boards.length) return h("div", {class: "dz-sub"}, "No board is on this page.");
  const boards = page.boards.filter(b => matches(b.title || b.name));
  if (!boards.length) return noMatch();
  const problems = boards.filter(b => b.error);
  return [problems.map(b => h("div", {class: "problem"}, b.name + ": " + b.error)),
    canvasView(boards.filter(b => !b.error))];
}

// The design system: its colors in the first theme, its text styles, and
// its components in the groups and subgroups its groups.json lists, each
// under the line that introduces it. Each component's frame draws its
// preview at the preview's own size: the page sends the frame the width it
// has room for when the frame loads and when the preview says it is ready,
// and the frame answers with the size the preview takes (preview_fit.js). The Filter field in the toolbar hides the colors, text
// styles and components whose names do not hold what the person types.
function cardView(card) {
  const box = h("div", {class: "ds-comp", "data-name": card.name});
  if (card.error) box.append(h("div", {class: "problem"}, card.name + ": " + card.error));
  else {
    const frame = h("iframe", {class: "ds-prev", sandbox: "allow-scripts", loading: "lazy", title: card.name,
      style: "height: " + card.height + "px", src: data.base + "/component/" + encodeURIComponent(card.name)});
    frame.addEventListener("load", () => sendRoom(frame));
    box.append(frame);
  }
  box.append(h("span", {class: "ds-k"}, card.name));
  return box;
}
const cardsView = cards => cards.length ? h("div", {class: "ds-cards"}, cards.map(cardView)) : null;
function groupView(group) {
  return h("section", {class: "ds-group"}, h("h3", {}, group.name), h("p", {class: "ds-about"}, group.about),
    cardsView(group.cards),
    group.subgroups.map(sub => h("div", {class: "ds-sub"}, h("h4", {}, sub.name), h("p", {class: "ds-about"}, sub.about),
      cardsView(sub.cards))));
}
// The width a frame has room for: its row of components, less its border.
function sendRoom(frame) {
  const row = frame.closest(".ds-cards");
  if (row && frame.contentWindow) frame.contentWindow.postMessage({previewWidth: row.clientWidth - 2}, "*");
}
window.addEventListener("message", e => {
  if (!e.data) return;
  const frame = [...document.querySelectorAll("iframe.ds-prev")].find(f => f.contentWindow === e.source);
  if (!frame) return;
  if (e.data.previewReady) sendRoom(frame);
  const size = e.data.previewSize;
  if (!size) return;
  frame.style.width = (size.w + 2) + "px";
  frame.style.height = (size.h + 2) + "px";
});
let roomPending = false;
window.addEventListener("resize", () => {
  if (roomPending) return;
  roomPending = true;
  requestAnimationFrame(() => {
    roomPending = false;
    document.querySelectorAll("iframe.ds-prev").forEach(sendRoom);
  });
});
// The Filter field's text, which every tab uses and which the tabs keep.
const filterInput = document.getElementById("filter");
const words = () => filterInput.value.trim().toLowerCase();
const matches = title => title.toLowerCase().includes(words());
const noMatch = () => h("div", {class: "dz-sub", "data-none": ""}, "Nothing here has \u201c" + filterInput.value.trim() + "\u201d in its title.");
// Hides the items of the design system tab that the Filter text does not
// match, and each part that is left with none. The tab keeps its frames, so
// typing does not load them again.
function filterSystem() {
  const main = document.getElementById("main");
  for (const none of main.querySelectorAll("[data-none]")) none.remove();
  const items = main.querySelectorAll("[data-name]");
  let shown = 0;
  for (const item of items) {
    item.hidden = !matches(item.dataset.name);
    if (!item.hidden) shown++;
  }
  const all = !words();
  for (const part of main.querySelectorAll(".ds-cards, .ds-sub, .ds-group, .ds-swatches, .ds-type, .ds-sec"))
    part.hidden = !all && !part.querySelector("[data-name]:not([hidden])");
  if (!all && items.length && !shown) main.append(noMatch());
}
function systemView() {
  const out = [];
  const s = data.system;
  if (s.error) out.push(h("div", {class: "problem"}, s.error));
  else {
    if (s.colors.length) out.push(h("section", {class: "ds-sec"}, h("h2", {}, "Colors"),
      h("div", {class: "ds-swatches"}, s.colors.map(c => h("div", {class: "ds-sw", title: c.value, "data-name": c.name},
        h("div", {class: "ds-chip", style: "background: " + c.value}), h("span", {class: "ds-k"}, c.name))))));
    if (s.styles.length) out.push(h("section", {class: "ds-sec"}, h("h2", {}, "Type"),
      h("div", {class: "ds-type"}, s.styles.map(t => h("div", {"data-name": t.name},
        h("span", {class: "ds-k"}, t.name), h("span", {style: t.css}, t.words))))));
  }
  const c = data.components;
  if (c.error) out.push(h("div", {class: "problem"}, c.error));
  else if (c.groups.length || c.problems.length) {
    const groups = h("div", {class: "ds-groups"}, c.groups.map(groupView));
    out.push(h("section", {class: "ds-sec"}, h("h2", {}, "Components"),
      c.problems.map(p => h("div", {class: "problem"}, p)), groups));
  }
  if (!out.length) out.push(h("div", {class: "dz-sub"}, "The design system has no colors, text styles or components."));
  return out;
}

// The scratch boards of the repo's worktrees: boards that no commit holds,
// which a design session draws to compare versions with the person. Each
// opens its scratch view, and a file whose name names no board says why.
// The dashboard gives the list, and the tab, only on this Mac.
function scratchView() {
  const s = data.scratch;
  if (s.error) return h("div", {class: "problem"}, s.error);
  if (!s.boards.length) return h("div", {class: "dz-sub"}, "No worktree has a scratch board, a file design/mocks/scratch.<name>.dc.html that no commit holds.");
  const boards = s.boards.filter(b => matches(b.board || b.file));
  if (!boards.length) return noMatch();
  return h("ul", {class: "scratch"}, boards.map(b => h("li", {},
    b.error ? h("span", {class: "problem"}, b.file + " in " + b.worktree + ": " + b.error)
      : [h("a", {href: b.link}, b.board), h("span", {class: "dz-sub"}, " in " + b.worktree)])));
}

function render() {
  renderTabs();
  const id = chosen();
  const page = data.pages.find(p => p.id === id);
  const view = [page ? pageView(page) : id === SCRATCH ? scratchView() : systemView()].flat();
  document.getElementById("main").replaceChildren(...view);
  if (id === SYSTEM) filterSystem();
}
// Typing redraws the tab: a page or the scratch list draws only the entries
// that match, and the design system tab hides the ones that do not.
filterInput.addEventListener("input", () => { if (chosen() === SYSTEM) filterSystem(); else render(); });
// The toolbar's height, which the stuck headings sit under.
new ResizeObserver(() => document.documentElement.style.setProperty("--bar", document.getElementById("bar").offsetHeight + "px"))
  .observe(document.getElementById("bar"));
document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (!b) return;
  history.replaceState(null, "", "#" + encodeURIComponent(b.dataset.tab));
  render();
});
window.addEventListener("hashchange", render);
render();

// Publish to claude.ai: the person picks a commit and asks the design
// session that listens for the project to publish it; the store holds the
// request, and the form shows it as the session takes it and ends it. The
// form keeps the newest request's result until the person dismisses it.
const pub = data.publish;
let standing = pub.standing || {latest: null};
let failure = null;
const here = ["127.0.0.1", "localhost", "[::1]"].includes(location.hostname);
const DISMISSED = "designs-publish-dismissed:" + data.project;
// The id of the newest request the person dismissed. The page variable is
// the state; localStorage only carries it across reloads, and the page works
// without it.
let dismissedId = 0;
try { dismissedId = Number(localStorage.getItem(DISMISSED)) || 0; } catch (e) { /* none remembered */ }
function dismiss(id) {
  dismissedId = id;
  try { localStorage.setItem(DISMISSED, String(id)); } catch (e) { /* not remembered across reloads */ }
}
function minute(at) {
  return new Date(at * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", hour12: false});
}
const short = commit => h("code", {title: commit}, commit.slice(0, 7));
function renderHead() {
  const line = document.getElementById("claude"), tools = document.getElementById("tools");
  if (pub.error) { line.replaceChildren(h("span", {class: "problem"}, pub.error)); tools.replaceChildren(); return; }
  if (!pub.canvas) {
    line.replaceChildren("These designs publish to no claude.ai artifact yet: the repo has no design/mocks/canvases.toml.");
    tools.replaceChildren();
    return;
  }
  line.replaceChildren();
  const button = h("button", {type: "button", class: "qbtn"}, "Publish to claude.ai…");
  button.addEventListener("click", openPublish);
  tools.replaceChildren(button);
}
// The request the form shows: the newest, unless it ended and the person
// dismissed it.
function shown() {
  const r = standing.latest;
  return r && !(r.ended && r.id === dismissedId) ? r : null;
}
function status(r) {
  if (!r.ended) return h("div", {class: "bstatus"}, "Publishing ", short(r.commit), r.taken
    ? " · the design session took it at " + minute(r.taken.at)
    : " · asked at " + minute(r.asked.at) + ", waiting for the design session to take it");
  if (r.ended.outcome === "failed") return h("div", {class: "bstatus failed"}, "Failed to publish ", short(r.commit),
    " · ended " + minute(r.ended.at) + ": " + r.ended.error);
  return h("div", {class: "bstatus"}, "Published ", short(r.commit), " · ended " + minute(r.ended.at));
}
function renderPublish() {
  document.getElementById("pub-title").textContent = "Publish " + data.project + " designs to claude.ai";
  const body = document.getElementById("pub-body");
  if (!here) { body.replaceChildren(h("div", {class: "pub-now"}, "Publishing is only on this Mac.")); return; }
  const r = shown();
  const open = !!(r && !r.ended);
  const input = h("input", {value: "origin/main", "aria-label": "Commit"});
  const go = h("button", {type: "button", class: "qbtn"}, "Publish");
  if (open) { input.disabled = true; go.disabled = true; }
  go.addEventListener("click", () => ask(input.value, go));
  const parts = [];
  if (!r && !failure) parts.push(h("div", {class: "pub-now"},
    "Publish sends every canvas and the design system from one commit."));
  parts.push(h("div", {class: "bform"}, input, go));
  if (failure) parts.push(h("div", {class: "bresult"}, h("div", {class: "bstatus failed"}, failure),
    dismissButton(() => { failure = null; renderPublish(); })));
  else if (r) {
    parts.push(h("div", {class: "bresult"}, status(r), r.ended ? dismissButton(() => {
      dismiss(r.id);
      renderPublish();
    }) : null));
    if (r.ended && r.ended.outcome === "published") parts.push(h("div", {class: "pub-links"},
      r.ended.links.map(l => h("a", {href: l.url, target: "_blank", rel: "noopener"}, l.title))));
  }
  body.replaceChildren(...parts);
}
async function ask(commit, button) {
  button.disabled = true;
  failure = null;
  try {
    const response = await fetch("/designs/" + encodeURIComponent(data.project) + "/publish",
      {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({commit: commit.trim()})});
    const answer = await response.json();
    if (!response.ok) failure = answer.error || "publishing failed";
    else standing = Object.assign({}, standing, {latest: answer});
  } catch (error) {
    failure = "publishing failed: " + error;
  }
  renderHead();
  renderPublish();
}
function openPublish() {
  renderPublish();
  document.getElementById("publish").showModal();
}
document.getElementById("pub-close").addEventListener("click", () => document.getElementById("publish").close());
renderHead();
// The daemon sends the project's publishing each time a write changes the
// store: when the session takes the request, and when it ends it.
if (pub.canvas) {
  const events = new EventSource("/designs/" + encodeURIComponent(data.project) + "/publish/events");
  events.addEventListener("publish", e => {
    standing = JSON.parse(e.data);
    renderHead();
    renderPublish();
  });
  events.addEventListener("failure", e => {
    failure = "reading the publish requests failed: " + JSON.parse(e.data).error;
    renderPublish();
  });
}
</script>
</body>
