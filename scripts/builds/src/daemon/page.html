<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --bg: #F6F6F3; --surface: #FFFFFF; --pinned: #EDEDE8; --pinned-line: #DADAD3;
  --line: #E2E2DC; --line-soft: #F0F0EA; --track: #ECECE6;
  --text: #1A1A19; --text-2: #2B2B29; --text-3: #3A3A37; --muted: #5C5C57; --muted-2: #6B6B66;
  --ok: #2E7D4F; --warn: #9A5B00; --bad: #B3261E; --bad-bg: #FDE7E5;
  --accent: #1F4FB8; --waiting-bg: #EEF3FC;
  --working-bg: #E7F2EA; --working: #1F5E38;
  --ready-bg: #E3ECFB; --ready: #1F4FB8;
  --you-bg: #FBEBDD; --you: #8A3E08;
  --winding-bg: #EFEDE6; --winding: #4F4C42;
  --free-bg: #F1F1EC; --free: #5C5C57;
  --dot-you: #C25E10; --dot-ready: #1F4FB8; --dot-working: #2E7D4F; --dot-free: #9A9A92;
  --on: #1A1A19; --on-text: #FFFFFF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --surface: #1F1F1D; --pinned: #262624; --pinned-line: #383833;
    --line: #34342F; --line-soft: #2B2B28; --track: #34342F;
    --text: #ECECE8; --text-2: #D9D9D3; --text-3: #C9C9C2; --muted: #A6A69F; --muted-2: #9C9C95;
    --ok: #5DBB84; --warn: #E8A84A; --bad: #FF8A80; --bad-bg: #3D1A17;
    --accent: #93B2FF; --waiting-bg: #1C2538;
    --working-bg: #1C3324; --working: #93D8AE;
    --ready-bg: #1D2A45; --ready: #A9C3FF;
    --you-bg: #3E2614; --you: #F6B27C;
    --winding-bg: #2D2B25; --winding: #D3CEBD;
    --free-bg: #2A2A27; --free: #B5B5AE;
    --dot-you: #E07A2E; --dot-ready: #6F95F0; --dot-working: #4FAE76; --dot-free: #85857E;
    --on: #ECECE8; --on-text: #161615;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
.mono { font-family: var(--mono); }
.error { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 8px 10px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.loading { font-size: 14px; color: var(--muted); }
.bad { color: var(--bad); font-weight: 600; }
.warn { color: var(--warn); font-weight: 600; }

/* The page: the checkouts on the left, the Lists panel on the right from 1200px (above them when narrower). */
.page { padding: 24px 28px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; min-height: 100vh; align-content: start; }
.left { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.hdr { display: flex; flex-direction: column; gap: 12px; }
.hdr .title { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.hdr .title .top { flex: 1 1 auto; min-width: 0; }
h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.conn { color: var(--bad); font-size: 13px; font-weight: 600; margin-top: -6px; }
.conn[hidden] { display: none; }
.side-toggle { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; font: 600 13px var(--sans); color: var(--muted); cursor: pointer; }
.side-toggle:hover { color: var(--text); border-color: var(--muted-2); }
.side-toggle.show { display: none; }
.page.no-lists .side-toggle.show { display: inline-flex; }
.side-hide { margin-left: auto; background: transparent; border: 0; color: var(--muted); padding: 4px; border-radius: 6px; cursor: pointer; display: inline-flex; }
.side-hide:hover { color: var(--text); background: var(--surface); }
.side-toggle:focus-visible, .side-hide:focus-visible, .fig.hook:focus-visible, .more-wts:focus-visible, .qbtn:focus-visible, .qw:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* The figures. */
.top { display: flex; flex-wrap: wrap; align-items: stretch; gap: 10px; }
.fig { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; font-size: 12px; color: var(--muted-2); }
.fig .h { font-size: 12px; color: var(--muted); }
.fig .v { font: 500 18px var(--mono); color: var(--text); line-height: 1.1; }
.fig .v small { font: 400 12px var(--sans); color: var(--muted-2); margin-left: 4px; }
.fig .row { display: flex; align-items: flex-end; gap: 12px; }
.fig.bad .v, .fig .h.bad { color: var(--bad); }
.fig.hook { cursor: pointer; }
.fig.hook:hover { border-color: var(--muted-2); }
.fig.hook.on { border-color: var(--accent); }
.fig.hook.empty { cursor: default; }
.fig.hook.empty:hover { border-color: var(--line); }
.fig svg .b-ok, .lane-head .b-ok { fill: var(--muted-2); opacity: .55; }
.fig svg .b-over { fill: var(--warn); }
.fig svg .limit { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 2 2; }
.fig .spark { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.fig .cores { stroke: var(--muted-2); stroke-width: 1; stroke-dasharray: 2 2; }
.fig.hook svg:not(.glyph) { width: 72px; height: 24px; }
.fig.hook .h svg.glyph { width: 12px; height: 12px; vertical-align: -1px; }
.fig .row svg[aria-label] { width: 64px; }
.fig.line { flex-direction: row; align-items: center; padding: 6px 12px; }
.fig.line .row { align-items: center; gap: 8px; }
.fig.line .v { font-size: 16px; }
.fig.line .h { white-space: nowrap; }
.act { background: var(--you-bg); color: var(--you); border-radius: 10px; padding: 8px 14px; font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; overflow-wrap: anywhere; }
.act b { font-weight: 700; }
.act code { font: 500 12px var(--mono); background: color-mix(in srgb, var(--you) 10%, transparent); border-radius: 6px; padding: 1px 6px; margin-left: 6px; overflow-wrap: anywhere; user-select: all; }

/* A repo's commit hook details, under the figures. */
.hook-open { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
.hook-open[hidden] { display: none; }
.ho-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.ho-head > span { color: var(--muted); }
.ho-close { margin-left: auto; background: transparent; border: 0; color: var(--muted); font-size: 18px; line-height: 1; cursor: pointer; }
.ho-close:hover { color: var(--text); }
.ho-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 12px 24px; }
.hook-open h3 { margin: 0 0 4px; font-size: 12px; font-weight: 600; color: var(--muted-2); }
.hook-open table { border-collapse: collapse; width: 100%; font-size: 12px; }
.hook-open th { text-align: left; font-weight: 600; color: var(--muted); padding: 3px 10px 3px 0; }
.hook-open td { padding: 3px 10px 3px 0; border-top: 1px solid var(--line-soft); }
.hook-open .n { text-align: right; font-variant-numeric: tabular-nums; }
.hook-open .ok { color: var(--working); } .hook-open .warn { color: var(--warn); } .hook-open .bad { color: var(--bad); }
.ho-more { font-size: 12px; color: var(--muted); padding-top: 4px; cursor: pointer; background: transparent; border: 0; text-align: left; font-family: var(--sans); }
.ho-more:hover { color: var(--text); }
.oruns { display: flex; flex-direction: column; }
.orun { border-top: 1px solid var(--line-soft); }
.orun summary { padding: 4px 0; font-size: 12px; display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; cursor: pointer; list-style: none; }
.orun summary::-webkit-details-marker { display: none; }
.orun .t { font: 500 12px var(--mono); color: var(--warn); min-width: 48px; }
.orun .when, .orun .slow { color: var(--muted); }
.orun .slow { flex-basis: 100%; padding-left: 58px; }
.orun .checks { padding: 2px 0 6px 58px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 1px; }

.lanes { align-items: start; }
/* A lane's checkouts, each with what builds there, and the queue they share. */
.lane-co + .lane-co { border-top: 1px solid color-mix(in srgb, var(--working) 25%, transparent); }
.lane-co .co { display: flex; justify-content: space-between; align-items: baseline; }
.lane-co .co .br { font: 500 12px var(--mono); }
.lane-co .co .disk { font: 500 13px var(--mono); }
.lane-wait { list-style: none; margin: 0; padding: 0 16px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.lane-wait li { display: grid; grid-template-columns: 18px minmax(0, 1fr) max-content max-content; gap: 10px; align-items: baseline; }
.lane-wait .qp { font: 500 13px var(--mono); }
.lane-wait .qb { font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lane-wait .br, .lane-wait .qt { font: 12px var(--mono); color: var(--muted); }
.lane.building .lane-wait .br, .lane.building .lane-wait .qt { color: color-mix(in srgb, var(--working) 80%, transparent); }

/* A lane's wait figure and the times it opens: its steps, costliest first. */
.wait-open .wp-steps { width: 100%; }
.wait-open .wp-steps .wp-kind { color: var(--muted); font-size: 12px; width: 60px; }
.wait-open .wp-steps .wp-name { font: 12px var(--mono); color: var(--text-2); }
.wait-open .wp-total { width: 40%; position: relative; }
.wait-open .wp-bar { display: inline-block; height: 8px; border-radius: 2px; background: var(--accent); opacity: .55; vertical-align: middle; margin-right: 8px; }
.wait-open .wp-tv { font: 500 12px var(--mono); color: var(--text); vertical-align: middle; }
.wait-open .wp-steps .wp-more td { color: var(--muted); font-size: 12px; border-top: 1px solid var(--line-soft); padding-top: 6px; cursor: pointer; }
.wait-open .wp-steps .wp-more td:hover { color: var(--text); }

/* The checkouts, grouped by repo. */
#findings:empty, #errors:empty { display: none; }
#view { display: flex; flex-direction: column; gap: 20px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.group h2 { margin: 0; font-size: 13px; font-weight: 700; color: var(--muted); }
.group-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.lanes, .wts { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(360px, 100%), 1fr)); gap: 10px; }
.lanes { margin-bottom: 14px; }
.lanes[hidden] { display: none; }
.wts > .more-wts { align-self: start; }
.more-wts { border: 1px dashed var(--line); border-radius: 12px; background: transparent; color: var(--muted); font: 600 14px var(--sans); padding: 12px 16px; display: flex; align-items: center; cursor: pointer; text-align: left; min-height: 48px; }
.more-wts:hover { border-color: var(--muted-2); color: var(--text-2); }

.wt-card { background: var(--surface); border: 1px solid var(--surface); border-radius: 12px; padding: 12px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.wt-card .t { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.wt-card .t > span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wt-card .t b { font-weight: 700; font-size: 15px; }
.wt-card .br { font: 400 13px var(--mono); color: var(--muted); margin-left: 4px; }
.wt-card .what { color: var(--text-2); }
.wt-card .title { color: var(--text); font-weight: 600; }
.wt-card .title + .what { font-size: 13px; color: var(--muted); }
.wt-card > *:has(+ .foot) { margin-bottom: 6px; }
.wt-card .foot { margin-top: auto; padding-top: 8px; border-top: 1px solid var(--line-soft); display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.wt-card .tree { margin-left: auto; }
.ic { display: inline-flex; align-items: center; gap: 5px; font-variant-numeric: tabular-nums; }
.ic svg { flex: none; }
.quiet { color: var(--muted-2); font-style: italic; border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; }
.bar { margin: -13px -17px 6px; border-radius: 12px 12px 0 0; padding: 7px 17px; background: var(--line-soft); color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 2px 12px; }
.bar.building { background: var(--working-bg); color: var(--working); }
.bar.ready { background: var(--ready-bg); color: var(--ready); }
.bar.you { background: var(--you-bg); color: var(--you); }
/* A worktree whose branch waits in an app build lane's queue. */
.bar.queued { background: var(--winding-bg); color: var(--winding); }
.bar.queued .disk { color: var(--winding); }
/* A worktree whose commits wait on their rules review before they can land. */
.bar.inreview { background: var(--winding-bg); color: var(--winding); }
.bar.inreview .disk { color: var(--winding); }
.wt-card .steps { font: 12px var(--mono); }
.bar .qplace { font: 500 12px var(--mono); margin-left: 4px; }
.bar .grp { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: center; }
.bar .l-id { margin-right: -6px; color: inherit; opacity: 0.75; }
.bar .state { font-weight: 600; }
.bar .disk { margin-left: auto; font: 500 13px var(--mono); }
.bar.ready .disk { color: var(--ready); }
.bar .bar-procs { flex-basis: 100%; font: 12px var(--mono); overflow-wrap: anywhere; }
.bar .bar-procs .ic { display: inline; font: inherit; }
.bar .bar-procs .ic svg { vertical-align: -2px; margin-right: 5px; }
.land { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.land .c { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 10px; align-items: baseline; }
.land .c .mono { color: var(--muted-2); font-size: 12px; }
.land .c > span:not(.mono) { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.land details summary { cursor: pointer; padding: 0; font-size: 12px; color: var(--muted); list-style: none; }
.land details summary::-webkit-details-marker { display: none; }
.land details .c { margin-top: 2px; }

/* An app build lane: one card wide, green all over while it builds. */
.lane { border: 1px solid var(--line); border-radius: 12px; background: transparent; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.lane.building { background: var(--working-bg); border-color: color-mix(in srgb, var(--working) 35%, transparent); color: var(--working); }
.lane.building .lane-head, .lane.building .lane-q, .lane.building .lane-open { border-color: color-mix(in srgb, var(--working) 25%, transparent); }
.lane.building .lane-head b, .lane.building .lane-q .qn { color: var(--working); }
.lane.building .lane-head .br, .lane.building .lane-head .disk, .lane.building .lane-q { color: color-mix(in srgb, var(--working) 80%, transparent); }
.lane-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.lane-head > span:first-child { min-width: 0; overflow-wrap: anywhere; }
.lane-head b { font-size: 15px; font-weight: 700; }
.lane-head .br { font: 400 12px var(--mono); color: var(--muted); margin-left: 4px; white-space: nowrap; }
.lane-head .wf { flex: none; display: flex; align-items: center; gap: 8px; cursor: pointer; border-radius: 6px; }
.lane-head .wf.empty { cursor: default; }
.lane-head .wf .h { font-size: 12px; color: var(--muted); }
.lane-head .wf .v { font: 500 13px var(--mono); color: var(--text); }
.lane-head .wf.on .v { color: var(--accent); }
.lane-head .wf:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.lane.building .lane-head .wf .h, .lane.building .lane-head .wf .v { color: var(--working); }
.lane-head .disk { font: 500 13px var(--mono); color: var(--muted); }
.lane-now { flex: 1; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.lane-now .who { font-weight: 600; }
.lane-now .use { font: 12px var(--mono); }
.lane-now .procs { font: 12px var(--mono); overflow-wrap: anywhere; }
.lane-now .procs .ic { display: inline; font: inherit; }
.lane-now .procs .ic svg { vertical-align: -2px; margin-right: 5px; }
.lane-now.stuck .who { color: var(--text); }
.procs-plain { font: 12px var(--mono); color: var(--muted); overflow-wrap: anywhere; }
.lane-q { padding: 10px 16px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); }
.lane-q .qn { font: 500 20px var(--mono); color: var(--text); line-height: 1; }
.lane-q .qw { min-width: 0; flex: 1; cursor: pointer; }
.lane-q .qw:hover { text-decoration: underline; }
.lane-open { padding: 10px 16px; display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); font-size: 13px; }
.lane-open .label { font-size: 12px; font-weight: 600; }
.qrow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.qrow .queued { flex: 1 1 auto; min-width: 0; overflow-wrap: anywhere; }
.qbtn { flex: none; font: 600 12px var(--sans); color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; white-space: nowrap; }
.qbtn.danger { color: var(--bad); }
.qbtn:disabled { color: var(--muted); cursor: default; }
.lane.building .qbtn { color: var(--working); border-color: color-mix(in srgb, var(--working) 35%, transparent); }
.bform { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.bform input { flex: 1 1 140px; min-width: 0; font: 12px var(--mono); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.bform input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bstatus { font-size: 13px; line-height: 1.4; overflow-wrap: anywhere; }
.bstatus.failed { color: var(--bad); }
.boutput { margin: 0; font: 11px/1.4 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; max-height: 260px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); }
.boutput[hidden] { display: none; }

@media (max-width: 600px) {
  .page { padding: 16px 16px 40px; gap: 16px; }
}


/* The lists sidebar: wide and sticky from 1200px, above the checkouts below it. */
.lists { order: -1; min-width: 0; background: var(--pinned); border: 1px solid var(--pinned-line); border-radius: 14px; padding: 0 12px 12px; max-height: 70vh; overflow: auto; }
.page.no-lists .lists { display: none; }
@media (min-width: 1200px) {
  .page { grid-template-columns: minmax(0, 1fr) minmax(440px, 40%); gap: 28px; }
  .page.no-lists { grid-template-columns: minmax(0, 1fr); }
  .lists { order: 0; position: sticky; top: 24px; max-height: none; height: calc(100vh - 48px); }
}
.l-top { position: sticky; top: 0; z-index: 2; background: var(--pinned); padding: 12px 0 10px; display: flex; flex-direction: column; gap: 10px; }
.l-head { display: flex; align-items: center; gap: 10px; }
.l-head h2 { margin: 0; font-size: 16px; font-weight: 700; }
.l-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.l-tabs[hidden] { display: none; }
.l-tabs.l-projects { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); margin-bottom: 6px; }
.l-tabs button { display: flex; flex-direction: row; justify-content: center; align-items: baseline; gap: 6px; font: 600 13px var(--sans); color: var(--muted); background: transparent; border: 0; border-radius: 7px; padding: 5px 4px; cursor: pointer; min-width: 0; }
.l-tabs button[aria-selected="true"] { background: var(--on); color: var(--on-text); }
.l-tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.l-tabs .l-count { font: 500 12px var(--mono); white-space: nowrap; opacity: 0.85; }
/* The tags of the open questions and items: All, then each tag with its count; one chosen shows only its entries. */
.l-tagbar { display: flex; flex-wrap: wrap; gap: 4px; }
.l-tagbar[hidden] { display: none; }
.l-tagbar button { display: inline-flex; align-items: baseline; gap: 6px; max-width: 100%; font: 500 12px var(--sans); color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; cursor: pointer; overflow-wrap: anywhere; text-align: left; }
.l-tagbar button .l-count { font: 500 11px var(--mono); white-space: nowrap; opacity: 0.85; }
.l-tagbar button[aria-pressed="true"] { background: var(--on); border-color: var(--on); color: var(--on-text); }
.l-tagbar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* A row's trail: the tags of the records on it, then each record from the first to the row's own, on one line. */

<body>
<div class="page" id="page">
<div class="left">
<header class="hdr">
  <div class="title">
    <h1>Builds</h1>
    <div class="top" id="top"></div>
    <button class="side-toggle show" id="lists-show" type="button" title="Show the Lists panel"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><path d="M10 2.75v10.5"/></svg><span>Lists</span></button>
  </div>
  <div class="conn" id="conn" hidden>Lost the connection to the daemon. This page reconnects by itself.</div>
  <section class="hook-open" id="hook-open" hidden></section>
  <section class="hook-open wait-open" id="wait-open" hidden></section>
</header>
<div id="findings"></div>
<div id="errors"></div>
<main id="view"><div class="loading">Reading the checkouts</div></main>
</div>
<aside class="lists" id="lists" aria-label="Lists">
  <div class="l-top">
    <div class="l-head"><h2>Lists</h2><button class="side-hide" id="lists-hide" type="button" title="Hide the Lists panel" aria-label="Hide the Lists panel"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><path d="M10 2.75v10.5"/></svg></button></div>
    <div class="l-tabs l-projects" id="l-projects" role="tablist" aria-label="Projects" hidden></div>
    <div class="l-tabs" id="l-tabs" role="tablist" hidden>
      <button type="button" role="tab" data-tab="stack"><span class="l-name">Waiting on you</span><span class="l-count"></span></button>
      <button type="button" role="tab" data-tab="running"><span class="l-name">Running</span><span class="l-count"></span></button>
      <button type="button" role="tab" data-tab="queue"><span class="l-name">Queue</span><span class="l-count"></span></button>
    </div>
    <div class="l-tagbar" id="l-tags" role="group" aria-label="Show the entries of one tag" hidden></div>
  </div>
  <div class="l-body" id="l-body"><div class="l-empty">Reading the lists</div></div>
</aside>
</div>
<dialog class="review" id="review" aria-label="Design change review">
  <div class="rv-head"><span class="rv-title" id="rv-title"></span><a id="rv-open" target="_blank" rel="noopener">Open in its own tab</a><button type="button" id="rv-close">Close</button></div>
  <iframe class="rv-frame" id="rv-frame" title="Design change review"></iframe>
</dialog>
<script>
"use strict";
// The states the daemon derives for each side worktree (worktree_state in
// model.rs), in the order the cards sort.
const ORDER = ["waiting-on-you", "ready-to-land", "in-review", "queued", "winding-down", "working", "held", "free"];
const LISTS_HIDDEN_KEY = "builds-dashboard-lists-hidden";
let state = null, streamError = "", connectionDown = false;
let hooks = null, hooksError = "";
let openHook = null;           // the repo whose commit hook details are open
let openWait = null;           // "repo lane" of the lane whose app build times are open
const showFree = new Set();    // repos whose free worktrees are open
const openQueue = new Set();   // "repo lane" of each lane whose queue is open
const openBuild = new Set();   // "repo lane" of each lane whose build form is open
const openRuns = new Set();    // hook runs opened to their checks
const moreOf = new Set();      // which "N more" lines of the hook details are open

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (typeof v === "function") el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(typeof kid === "string" ? document.createTextNode(kid) : kid);
  }
  return el;
}
function size(kib) {
  if (kib === null || kib === undefined) return "-";
  return kib >= 1048576 ? (kib / 1048576).toFixed(1) + "G" : Math.floor(kib / 1024) + "M";
}
function bytes(n) { return size(Math.floor(n / 1024)); }
function wholeSize(kib) { return size(kib).replace(".0G", "G"); }
function ago(epoch) {
  const s = Math.max(0, Date.now() / 1000 - epoch);
  if (s < 60) return Math.round(s) + "s";
  if (s < 3600) return Math.round(s / 60) + "m";
  if (s < 172800) return Math.round(s / 3600) + "h";
  return Math.round(s / 86400) + "d";
}
// A span whose text is "<before><age><after>", kept current by the ticker
// without redrawing its card.
function agoSpan(epoch, before, after, attrs) {
  return h("span", Object.assign({"data-ago": String(epoch), "data-before": before || "", "data-after": after || ""}, attrs || {}),
    (before || "") + ago(epoch) + (after || ""));
}
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function hhmm(d) { return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
// A local time as the clock today, "yesterday 22:52" or "Nov 3".
function when(d) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const day = new Date(d); day.setHours(0, 0, 0, 0);
  const days = Math.round((today - day) / 86400000);
  if (days <= 0) return hhmm(d);
  if (days === 1) return "yesterday " + hhmm(d);
  return MONTHS[d.getMonth()] + " " + d.getDate();
}
// A claim's date is local time, "YYYY-MM-DD HH:MM".
function since(text) {
  const t = Date.parse(text.replace(" ", "T"));
  return isNaN(t) ? text : when(new Date(t));
}
function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }
// A worktree's last activity: the newer of its HEAD commit and its newest
// uncommitted file, in epoch seconds; 0 when git said nothing.
function activity(c) {
  const g = c.git;
  if (!g || g.error) return 0;
  return Math.max(g.head ? g.head.time : 0, g.last_write || 0);
}
function sideNumber(name) { const m = /(\d+)$/.exec(name); return m ? Number(m[1]) : 0; }
// Most recent activity first.
function byActivity(a, b) { return activity(b) - activity(a) || sideNumber(a.name) - sideNumber(b.name); }
const QUIET_SECONDS = 30 * 60;
// Uncommitted files and no write to them for 30 minutes: an agent that may have stalled.
function quiet(c) {
  const g = c.git;
  return !!(g && !g.error && g.uncommitted && g.last_write && Date.now() / 1000 - g.last_write >= QUIET_SECONDS);
}

// What a checkout's build folders say.
function built(c) {
  if (!c.folders) return null;
  const out = {total: c.total_kib, newest: 0, chips: [], over: [], links: []};
  for (const f of c.folders) {
    if (!f.exists) continue;
    if (f.last_write && f.last_write > out.newest) out.newest = f.last_write;
    const over = f.kib !== null && f.kib > f.cap_kib;
    if (over) out.over.push(f.path + " " + size(f.kib) + " over its " + size(f.cap_kib) + " cap");
    if (f.link !== "linked") out.links.push(f.path + (f.link === "elsewhere" ? " links elsewhere" : " not linked"));
    // A folder under 1M shows as 0M: no build output worth a chip.
    if (f.kib === null || f.kib >= 1024) out.chips.push({path: f.path, kib: f.kib, over});
  }
  out.chips.sort((a, b) => (b.kib || 0) - (a.kib || 0));
  return out;
}


// An app lane has one queue for all its checkouts: who waits for whichever
// lock frees first.
function queueOf(repo, lane) {
  const q = repo.queues.find(x => x.lane === lane);
  return q ? q.queue : [];
}
// What holds the app lock, as its script's file name.
function shortCommand(command) {
  const words = command.split(/\s+/).filter(Boolean);
  const script = words.find((w, i) => i > 0 && /\.(sh|py|rb|js)$/.test(w));
  const name = (script || words[0] || command).split("/").pop();
  return {name, rest: script ? "" : words.slice(1, 3).join(" ")};
}
function detachedAt(c) {
  if (c.branch) return c.branch;
  return c.git && c.git.head ? "detached at " + c.git.head.sha : "detached";
}

// A repo's app checkouts (mac lane first) and its other live side worktrees,
// in the order the cards sort. The main checkout has no card.
function split(repo) {
  const sides = repo.checkouts.filter(c => c.live && !c.main && !c.app_checkout);
  const place = c => c.words.queued ? c.words.queued.place : 0;
  sides.sort((a, b) => ORDER.indexOf(a.state) - ORDER.indexOf(b.state) || place(a) - place(b) || byActivity(a, b));
  return {sides};
}

// The controls that change state work only on the page served at 127.0.0.1 or
// localhost on this Mac: the daemon refuses them from any other address, so
// another address shows them as only on this Mac.
const here = ["127.0.0.1", "localhost", "[::1]"].includes(location.hostname);
const ONLY_HERE = "Only on this Mac";
// Who waits for the app lock, next first, each with the buttons that move it.
function queuedName(q) {
  return q.command.includes("build-app") ? "Your test app" : (q.started_from || "?").split("/").pop();
}
async function queueAction(action, lock, q) {
  try {
    const reply = await fetch("/api/queue", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({action, repo: lock.repo, pid: q.pid})});
    if (!reply.ok) {
      const body = await reply.json().catch(() => ({}));
      throw new Error(body.error || reply.status);
    }
    streamError = "";
  } catch (e) {
    streamError = "queue: " + e.message;
  }
  render();
}
// With every lock of the lane held, a takeover stops the build that joined
// last of the holders (queue.rs); with a lock free it only moves the waiter up.
function takeOver(holders, free, lock, q) {
  if (!free) {
    const names = holders.map(l => shortCommand(l.holder.command).name + " (held " + l.holder.minutes + "m)").join(", ");
    if (!confirm("Every lock is held (" + names + "). Stop the one that started last so " + queuedName(q) +
      " builds now? The stopped build goes straight behind it and runs again by itself.")) return;
  }
  queueAction("takeover", lock, q);
}
// A lane's waiting builds, each with the buttons that move it.
function queueList(repo, lane) {
  const queue = queueOf(repo, lane);
  const lock = {repo: repo.name, holder: null};
  const locks = repo.locks.filter(l => l.lane === lane);
  const holders = locks.filter(l => l.holder);
  const free = holders.length < locks.length;
  return h("div", {class: "lane-open"},
    h("span", {class: "label"}, "Waiting for whichever " + lane + " checkout frees first"),
    queue.length ? queue.map((q, i) => h("div", {class: "qrow"},
      h("span", {class: "queued", title: q.command}, (i + 1) + ". " + queuedName(q) + (q.minutes ? " · " + q.minutes + "m" : "")),
      here ? [
        i > 0 ? h("button", {type: "button", class: "qbtn", onclick: () => queueAction("top", lock, q)}, "Move to top") : null,
        h("button", {type: "button", class: "qbtn danger", onclick: () => takeOver(holders, free, lock, q)}, "Take over")]
        : h("span", {class: "queued"}, ONLY_HERE)))
      : h("span", {}, "Nothing waiting"));
}

// build-app: runs `builds build-app <repo> <lane> [<ref>]` in the daemon, and
// shows the run it started under its lane: queued or running, its output as
// it goes, how it ended. Each lane's panel is made once and updated in place,
// so the ref being typed survives the page's redraws.
const buildPanels = new Map();
const PHASES = {
  queued: "Queued: waiting for an app lock",
  running: "Running",
  succeeded: "Finished",
  failed: "Failed",
  detached: "Started before the daemon restarted and still running: the dashboard can't see how it ends",
  lost: "The daemon restarted while this ran and the build is gone: how it ended is unknown",

function phaseLine(run) {
  let text = PHASES[run.phase] || run.phase;
  if (run.phase === "failed") {
    text += run.signal ? " (signal " + run.signal + ")" : run.exit_code === null ? "" : " (exit " + run.exit_code + ")";
  }
  const at = run.ended_at || run.started_at;
  return text + " · " + (run.ended_at ? "ended " : "started ") + when(new Date(at * 1000)) + (run.ref ? " · " + run.ref : "");
}
async function startBuild(repo, lane, ref) {
  try {
    const reply = await fetch("/api/build-app", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({repo: repo.name, lane, ref: ref || null})});
    if (!reply.ok) {
      const body = await reply.json().catch(() => ({}));
      throw new Error(body.error || reply.status);
    }
    streamError = "";
  } catch (e) {
    streamError = "build-app: " + e.message;
  }
  render();
}
function buildPanel(repo, lane) {
  const ref = h("input", {type: "text", placeholder: "ref (default origin/main)", "aria-label": "ref to build", spellcheck: "false"});
  const button = h("button", {type: "button", class: "qbtn"}, "Build");
  const status = h("div", {class: "bstatus"});
  const output = h("pre", {class: "boutput"});
  const el = h("div", {class: "lane-open"}, h("span", {class: "label"}, "builds build-app " + repo.name + " " + lane),
    h("div", {class: "bform"}, ref, button), status, output);
  const panel = {el, ref, button, status, output, repo, lane};
  button.addEventListener("click", () => startBuild(panel.repo, lane, ref.value.trim()));
  return panel;
}
function updateBuildPanel(panel, repo, lane) {
  panel.repo = repo;
  const run = repo.runs.find(r => r.lane === lane);
  const active = run && ["queued", "running", "detached"].includes(run.phase);
  panel.button.disabled = !!active;
  panel.status.textContent = run ? phaseLine(run) : "No build started from this page.";
  panel.status.className = "bstatus" + (run && (run.phase === "failed" || run.phase === "lost") ? " failed" : "");
  const text = run ? (run.output_cut ? "…\n" : "") + run.output : "";
  panel.output.hidden = !run;
  if (panel.output.textContent !== text) {
    const atEnd = panel.output.scrollTop + panel.output.clientHeight >= panel.output.scrollHeight - 4;
    panel.output.textContent = text;
    if (atEnd) panel.output.scrollTop = panel.output.scrollHeight;
  }
}
function buildPanelOf(repo, lane) {
  const key = repo.name + " " + lane;
  if (!buildPanels.has(key)) buildPanels.set(key, buildPanel(repo, lane));
  const panel = buildPanels.get(key);
  updateBuildPanel(panel, repo, lane);
  return panel;
}

// An item's icons, each with its explanation on hover.
const ICONS = {
  commit: ["Last commit", "Last commit: time since the newest commit on this checkout's branch.", '<circle cx="8" cy="8" r="2.75"/><path d="M1 8h4.25M10.75 8H15"/>'],
  write: ["Last write", "Last write: time since a file in this worktree last changed, committed or not. A recent write means the agent is still editing.", '<path d="M10.5 2.5l3 3L6 13H3v-3z"/><path d="M9 4l3 3"/>'],
  claim: ["Claimed", "Claimed: how long an agent has owned this worktree for its task. Nobody else works here until the task lands and the claim is released.", '<circle cx="8" cy="5.25" r="2.75"/><path d="M2.75 14c.6-2.9 2.8-4.5 5.25-4.5s4.65 1.6 5.25 4.5"/>'],
  build: ["Building", "Building: how long the build running in this worktree has run, and the programs it runs.", '<g transform="rotate(-40 8 8)"><path d="M3.5 2.5h7.5a1.5 1.5 0 0 1 1.5 1.5v1.5H3.5l-1-1.5z"/><path d="M7.25 5.5h1.5V14.5h-1.5z"/></g>'],
};
function icon(name, epoch, text) {
  const [label, title, paths] = ICONS[name];
  const el = h("span", {class: "ic", title}, text === undefined ? agoSpan(epoch) : text);
  const svgEl = document.createElementNS(SVG, "svg");
  for (const [k, v] of Object.entries({viewBox: "0 0 16 16", width: "12", height: "12", fill: "none", stroke: "currentColor",
    "stroke-width": "1.5", "stroke-linecap": "round", "stroke-linejoin": "round", "aria-label": label})) svgEl.setAttribute(k, v);
  svgEl.innerHTML = paths;
  el.prepend(svgEl);
  return el;
}

// The counts of some days as a column: the number opened and who opened them,

function flowColumn(label, days) {

  }
  const split = obj => Object.entries(obj).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(([k, v]) => k + " " + v).join(" · ");
  return h("div", {class: "fl-col"}, h("span", {class: "fl-k"}, label),
    h("div", {class: "fl-row"}, h("span", {class: "fl-n"}, String(sum(opened))), h("span", {}, "opened")),
    h("div", {class: "fl-by"}, split(opened)),
    h("div", {class: "fl-row"}, h("span", {class: "fl-n"}, String(sum(closed))), h("span", {}, "closed")),
    h("div", {class: "fl-by"}, split(closed)));
}
function workHead() {
  const today = localDay(new Date());
  return h("div", {class: "l-flow"},
    flowColumn("Today", lists.flow.filter(d => d.day === today)),
    flowColumn("Last " + RECENT_DAYS + " days", lists.flow));
}
function rows(its, one) { return h("div", {class: "l-works"}, its.map(one || itemRow)); }
// A running work whose worktree has commits waiting to land is Ready to land
// once builds land would take them, and In review while their rules review is
// not finished; the rest are Working.
function checkoutState(w) {
  const repo = state && state.repos.find(r => r.name === w.repo);
  const c = repo && repo.checkouts.find(x => x.name === w.checkout);
  return c ? c.state : null;
}
// The running work Running shows while the reader has chosen no tag.
function runningWorks() { return lists.board.works.filter(w => w.tab === "running"); }
// With a tag chosen, only the running work whose items carry it.
function runningShown() {
  return {
    works: runningWorks().filter(w => tagged(workTags(w))),
    drawn: tagFilter ? [] : lists.designs.filter(g => !g.closed && g.approved),
  };
}
function runningItems() {
  const {works, drawn} = runningShown();
  const ready = works.filter(w => checkoutState(w) === "ready-to-land");
  const reviewing = works.filter(w => checkoutState(w) === "in-review");
  const working = works.filter(w => !ready.includes(w) && !reviewing.includes(w));
  const out = [];
  if (working.length) out.push({key: "working", data: working, make: () => section("Working", working.length,
    h("div", {class: "l-works"}, working.map(workRow)))});
  if (reviewing.length) out.push({key: "review", data: reviewing, make: () => section("In review", reviewing.length,
    h("div", {class: "l-works"}, reviewing.map(workRow)))});
  if (ready.length) out.push({key: "ready", data: ready, make: () => section("Ready to land", ready.length,
    h("div", {class: "l-works"}, ready.map(workRow)))});
  if (drawn.length) out.push({key: "drawn", data: drawn, make: () => section("Design changes being drawn", drawn.length,
    h("div", {class: "l-works"}, drawn.map(designRow)))});
  return out.length ? out : [empty(tagFilter ? "Nothing tagged " + tagFilter + " is running." : "Nothing is running.")];
}
// The items Queue shows while the reader has chosen no tag.
function queueEntries() { return lists.items.filter(it => !isRunning(it)); }
// With a tag chosen, only the items that carry it.
function queueShown() { return queueEntries().filter(it => tagged(it.trail.tags)); }
function queueItems() {
  const all = queueShown();
  const out = [{key: "head", data: [lists.flow], make: workHead}];
  const design = all.filter(it => !isRunning(it) && it.for === "design-session");
  const mine = all.filter(it => !isRunning(it) && it.for !== "design-session");
  const first = mine.filter(it => it.priority && it.priority.level === "first").sort((a, b) => a.opened.at - b.opened.at);
  const rest = mine.filter(it => !first.includes(it));
  const part = (key, title, its, one) => {
    if (its.length) out.push({key, data: its, make: () => section(title, its.length, rows(its, one))});
  };
  part("first", "First", first);
  for (const area of lists.areas) part("area:" + area, area, rest.filter(it => it.area === area));
  part("design-session", "Design session’s", design);
  if (out.length === 1) out.push(empty(tagFilter ? "No item in the queue is tagged " + tagFilter + "." : "The work queue is empty."));
  return out;
}

// ---- Design
// A design change is a light card, like a question's: what it blocks, who
// recorded it and when. Details opens its review page over the dashboard; one
// that landed has no page, only its words.
const sessionNote = {
  unrecorded: "No session is recorded for it, so the next design session lands it.",
  told: "The session that recorded it was told to land it.",
  ended: "The session that recorded it has ended, so the next design session lands it.",
};
function designRow(g) {
  const direct = g.blocks.length;
  const body = () => h("div", {class: "l-plain"},
    direct ? h("div", {class: "l-facts"},
      fact("Blocks", plural(direct, "item", "items") + ":"),
      h("ul", {class: "l-list"}, g.blocks.map(b => h("li", {}, recLink(b.id, b.title))))) : fact("Blocks nothing."),
    g.landed.length ? fact("Landed:", g.landed.map(l => l.commits.join(" ") + " " + stamp(l.at)).join("; ")) : null,
    g.approved ? fact("Approved, waiting to land:", stamp(g.approved.at)) : null,
    g.approved && sessionNote[g.session] ? fact(sessionNote[g.session]) : null,
    h("span", {class: "l-sub"}, "#" + g.id + " · ", opened(g, "Recorded")),
    g.closed ? md(g.details) : h("button", {type: "button", class: "l-details", onclick: () => openReview(g)}, "Details"));
  return fold("g:" + g.id, g.id,
    [h("span", {class: "l-title"}, idChip(g.id), g.title), h("span", {class: "l-wt"}, repoDisplayName(g.repo) + " design")], body, "l-work");
}
const reviewDialog = document.getElementById("review"), reviewFrame = document.getElementById("rv-frame");
// The review page of an open design change, drawn by the daemon from the
// change's worktree each time it loads.
function openReview(g) {
  const url = "/design/" + encodeURIComponent(lists.project) + "/" + g.id;
  document.getElementById("rv-title").textContent = g.title + " (#" + g.id + ")";
  document.getElementById("rv-open").href = url;
  reviewFrame.src = url;
  reviewDialog.showModal();
}
document.getElementById("rv-close").addEventListener("click", () => reviewDialog.close());
reviewDialog.addEventListener("click", e => { if (e.target === reviewDialog) reviewDialog.close(); });
reviewDialog.addEventListener("close", () => { reviewFrame.src = "about:blank"; });
// ---- The sidebar
function indexLists() {
  index = new Map();
  for (const q of lists.stack) index.set(q.id, {tab: "stack", key: "q:" + q.id, title: q.title});
  for (const it of lists.items) index.set(it.id, {tab: "queue", key: "i:" + it.id, title: it.title});
  for (const w of lists.board.works) for (const i of w.items) index.set(i.id, {tab: w.tab === "waiting" ? "stack" : "running", key: "i:" + w.items[0].id, title: i.title});
  for (const g of lists.designs) if (!g.closed) index.set(g.id, {tab: g.approved ? "running" : "stack", key: "g:" + g.id, title: g.title});
}
// `next` is {projects: [one lists JSON each]}; the sidebar shows the chosen one.
function setLists(next) {
  allLists = next.projects;
  lists = allLists.find(p => p.project === project) || allLists[0];
  if (!lists.error) indexLists();
  renderLists();
}
function renderProjects() {
  const bar = document.getElementById("l-projects");
  bar.hidden = allLists.length < 2;
  if (bar.hidden) return;
  bar.replaceChildren(...allLists.map(p => h("button", {type: "button", role: "tab", "data-project": p.project,
    "aria-selected": String(p === lists), title: p.error ? p.error : p.project},
    h("span", {class: "l-name"}, p.project || "none"),
    h("span", {class: "l-count"}, p.error ? "!" : String(p.board.waiting)))));
}
// The tabs' counts: the board's, or with a tag chosen what each tab shows.
function tabCounts() {
  const b = lists.board;
  if (!tagFilter) return {stack: String(b.waiting), running: String(b.running), queue: String(b.queue)};
  const stack = stackShown(), running = runningShown();
  return {stack: String(stack.own.length + stack.held.length), running: String(running.works.length), queue: String(queueShown().length)};
}
function renderLists() {
  const tabs = document.getElementById("l-tabs"), body = document.getElementById("l-body");
  renderProjects();
  if (!lists || lists.error) {
    tabs.hidden = true;
    document.getElementById("l-tags").hidden = true;
    body.dataset.tab = "";
    body.replaceChildren(lists ? h("div", {class: "error"}, "The lists store of " + (lists.project || "the projects") + " failed its check: " + lists.error)
      : h("div", {class: "l-empty"}, listsNote));
    return;
  }
  tabs.hidden = false;
  renderTags();
  const counts = tabCounts();
  for (const b of tabs.querySelectorAll("button")) {
    b.setAttribute("aria-selected", String(b.dataset.tab === tab));
    b.querySelector(".l-count").textContent = counts[b.dataset.tab];
  }
  if (body.dataset.tab !== tab) { body.replaceChildren(); body.dataset.tab = tab; }
  const items = {stack: stackItems, running: runningItems, queue: queueItems}[tab]();
  patch(body, items);
  tick();
}
function showRecord(id) {
  const rec = index.get(id);
  if (!rec) return;
  // A record the chosen tag hides shows with every entry.
  const own = lists.stack.find(q => q.id === id) || lists.items.find(i => i.id === id);
  if (tagFilter && !(own && tagged(own.trail.tags))) {
    tagFilter = "";
    try { localStorage.setItem(TAG_KEY, tagFilter); } catch (e) { /* kept for this page only */ }
  }
  tab = rec.tab;
  try { localStorage.setItem(TAB_KEY, tab); } catch (e) { /* kept for this page only */ }
  openRecs.add(rec.key); saveOpen();
  renderLists();
  const el = document.getElementById("l-body").querySelector('[data-rec="' + id + '"]');
  if (!el) return;
  const fold = el.tagName === "DETAILS" ? el : el.querySelector("details");
  if (fold) fold.open = true;
  el.scrollIntoView({block: "center"});
  el.classList.remove("l-flash"); void el.offsetWidth; el.classList.add("l-flash");
}
document.getElementById("l-projects").addEventListener("click", e => {
  const b = e.target.closest("button[data-project]");
  if (!b) return;
  project = b.dataset.project;
  try { localStorage.setItem(PROJECT_KEY, project); } catch (err) { /* kept for this page only */ }
  lists = allLists.find(p => p.project === project) || allLists[0];
  document.getElementById("l-body").dataset.tab = "";
  if (!lists.error) indexLists();
  renderLists();
});
document.getElementById("l-tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-tab]");
  if (!b) return;
  tab = b.dataset.tab;
  try { localStorage.setItem(TAB_KEY, tab); } catch (err) { /* kept for this page only */ }
  renderLists();
});
document.getElementById("l-tags").addEventListener("click", e => {
  const b = e.target.closest("button[data-tag]");
  if (!b) return;
  // The chosen tag again shows every entry.
  setTag(b.dataset.tag === tagFilter ? "" : b.dataset.tag);
});
document.getElementById("l-body").addEventListener("click", e => {
  // A tag on a row sits in the row's summary: choosing it must not open the row.
  const t = e.target.closest("button[data-tag]");
  if (t) { e.preventDefault(); setTag(t.dataset.tag); return; }
  const a = e.target.closest("a[data-ref]");
  if (!a) return;
  e.preventDefault();
  showRecord(Number(a.dataset.ref));
});
renderLists();
events.addEventListener("lists", e => setLists(JSON.parse(e.data)));
// The first read; the `lists` event takes over once it arrives. A daemon that
// doesn't serve the lists answers 404.
fetch("/api/lists").then(async reply => {
  if (reply.status === 404) throw new Error("This daemon doesn’t serve them yet.");
  if (!reply.ok) throw new Error("the daemon answered " + reply.status);
  const body = await reply.json();
  if (!lists) setLists(body);
}).catch(e => {
  if (lists) return;
  listsNote = "The lists aren’t available. " + e.message;
  renderLists();
});

// ---- The commit hook figures read what the hook ran for each project, from
// the `hooks` event (hook_stats.rs) and /api/hooks on load. ----
function setHooks(next) {
  hooks = next;
  const errors = hooks.error ? [hooks.error] : hooks.projects.filter(p => p.error).map(p => p.project + ": " + p.error);
  hooksError = errors.length ? "The hook runs: " + errors.join("; ") : "";
  render();
}
events.addEventListener("hooks", e => setHooks(JSON.parse(e.data)));
fetch("/api/hooks").then(async reply => {
  if (!reply.ok) throw new Error("the daemon answered " + reply.status);
  const body = await reply.json();
  if (!hooks) setHooks(body);
}).catch(() => { /* the `hooks` event shows them once the daemon sends it */ });
setInterval(tick, 1000);
render();
</script>
</body>
</html>
