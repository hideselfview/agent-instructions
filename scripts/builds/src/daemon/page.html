<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Builds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
  --sans: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --bg: #F6F6F3; --surface: #FFFFFF; --pinned: #EDEDE8; --pinned-line: #DADAD3;
  --line: #E2E2DC; --line-soft: #F0F0EA; --track: #ECECE6;
  --text: #1A1A19; --text-2: #2B2B29; --text-3: #3A3A37; --muted: #5C5C57; --muted-2: #6B6B66;
  --ok: #2E7D4F; --warn: #9A5B00; --bad: #B3261E; --bad-bg: #FDE7E5;
  --accent: #1F4FB8; --waiting-bg: #EEF3FC;
  --working-bg: #E7F2EA; --working: #1F5E38;
  --ready-bg: #E3ECFB; --ready: #1F4FB8;
  --you-bg: #FBEBDD; --you: #8A3E08;
  --winding-bg: #EFEDE6; --winding: #4F4C42;
  --free-bg: #F1F1EC; --free: #5C5C57;
  --dot-you: #C25E10; --dot-ready: #1F4FB8; --dot-working: #2E7D4F; --dot-free: #9A9A92;
  --on: #1A1A19; --on-text: #FFFFFF;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --surface: #1F1F1D; --pinned: #262624; --pinned-line: #383833;
    --line: #34342F; --line-soft: #2B2B28; --track: #34342F;
    --text: #ECECE8; --text-2: #D9D9D3; --text-3: #C9C9C2; --muted: #A6A69F; --muted-2: #9C9C95;
    --ok: #5DBB84; --warn: #E8A84A; --bad: #FF8A80; --bad-bg: #3D1A17;
    --accent: #93B2FF; --waiting-bg: #1C2538;
    --working-bg: #1C3324; --working: #93D8AE;
    --ready-bg: #1D2A45; --ready: #A9C3FF;
    --you-bg: #3E2614; --you: #F6B27C;
    --winding-bg: #2D2B25; --winding: #D3CEBD;
    --free-bg: #2A2A27; --free: #B5B5AE;
    --dot-you: #E07A2E; --dot-ready: #6F95F0; --dot-working: #4FAE76; --dot-free: #85857E;
    --on: #ECECE8; --on-text: #161615;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); }
.page { padding: 24px 28px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; min-height: 100vh; align-content: start; }
.left { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.mono { font-family: var(--mono); }

header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; }
.title { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; min-width: 0; }
h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }
.sub { font-size: 14px; color: var(--muted); }
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.switch { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.switch button { font: 600 13px var(--sans); color: var(--muted); background: transparent; border: 0; border-radius: 7px; padding: 5px 12px; cursor: pointer; }
.switch button[aria-pressed="true"] { background: var(--on); color: var(--on-text); }
.switch button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.hide-free { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-3); cursor: pointer; }
.hide-free input { margin: 0; accent-color: var(--on); cursor: pointer; }
.disk { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; }
.disk .label { font-size: 13px; color: var(--muted); }
.bar { position: relative; width: 140px; height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ok); }
.bar .mark { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--muted-2); }
.disk .free { font: 500 13px var(--mono); }
.disk .floors, .updated { font-size: 12px; color: var(--muted-2); }
.disk .floors.warn { color: var(--warn); }
.disk .floors.bad { color: var(--bad); }
.error { background: var(--bad-bg); color: var(--bad); border-radius: 8px; padding: 8px 10px; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.loading { font-size: 14px; color: var(--muted); }
#view { display: flex; flex-direction: column; gap: 28px; }

section.repo { display: flex; flex-direction: column; gap: 12px; }
.repo-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.repo-head h2 { margin: 0; font-size: 16px; font-weight: 700; }
.repo-head span { font-size: 13px; color: var(--muted); }
.pinned-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(420px, 100%), 1fr)); gap: 12px; align-items: stretch; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(320px, 100%), 1fr)); gap: 12px; align-items: stretch; }
article { min-width: 0; display: flex; flex-direction: column; }
.pinned { background: var(--pinned); border: 1px solid var(--pinned-line); border-radius: 12px; padding: 14px 16px; gap: 10px; }
/* Cards in a row stretch to the tallest; the title, agent and note stay at the
   top and the foot sits at the bottom. The min-height fits a usual card: title
   line, agent line, a two-line note and the foot. */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; gap: 10px; min-height: 176px; }
.card .foot { margin-top: auto; }
.row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.ident { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.name { font-size: 15px; font-weight: 700; white-space: nowrap; }
.where { font: 12px var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; flex: none; }
.s-working { background: var(--working-bg); color: var(--working); }
.s-ready { background: var(--ready-bg); color: var(--ready); }
.s-you { background: var(--you-bg); color: var(--you); }
.s-winding { background: var(--winding-bg); color: var(--winding); }
.s-free { background: var(--free-bg); color: var(--free); }
.line { font-size: 14px; line-height: 1.4; color: var(--text-2); overflow-wrap: anywhere; }
.total { display: flex; align-items: baseline; gap: 10px; }
.total .big { font: 500 20px var(--mono); }
.total .of { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px 8px; }
.chip { font-size: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; color: var(--text-3); overflow-wrap: anywhere; }
.chip .mono { color: var(--text); }
.more-folders summary { font-size: 12px; color: var(--muted); cursor: pointer; width: fit-content; }
.more-folders summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.more-folders .chips { margin-top: 6px; }
.chip.over { border-color: var(--bad); }
.chip.over .mono { color: var(--bad); }
.command { font: 12px/1.4 var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; color: var(--text); overflow-wrap: anywhere; white-space: pre-wrap; }
.who-block { display: flex; flex-direction: column; gap: 3px; }
.who { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
.note { font-size: 14px; line-height: 1.4; color: var(--text-2); overflow-wrap: anywhere; }
.waiting { background: var(--waiting-bg); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.waiting .label { font-size: 12px; font-weight: 600; color: var(--accent); }
.qrow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.qrow .queued { flex: 0 1 auto; min-width: 0; overflow-wrap: anywhere; }
.queues { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.qmenu { position: relative; }
.qmenu summary { list-style: none; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; color: var(--muted); cursor: pointer; }
.qmenu summary::-webkit-details-marker { display: none; }
.qmenu summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.qmenu .count { font: 500 13px var(--mono); color: var(--text); }
.qmenu[open] summary { border-color: var(--accent); }
.qpanel { position: absolute; right: 0; top: calc(100% + 6px); z-index: 10; min-width: 340px; max-width: min(420px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25); font-size: 13px; color: var(--text-2); }
.queues { position: relative; }
@media (max-width: 700px) { .qmenu { position: static; } .qpanel { left: 0; right: 0; max-width: none; } }
.qpanel .qrow { flex-wrap: nowrap; }
.qpanel .qbtn { flex: none; white-space: nowrap; }
.qpanel .label { font-size: 12px; font-weight: 600; color: var(--accent); }
.qbtn { font: 600 12px var(--sans); color: var(--accent); background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
.qbtn.danger { color: var(--bad); }
.qbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.bform { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; }
.bform input { flex: 1 1 140px; min-width: 0; font: 12px var(--mono); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.bform input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.qbtn:disabled { color: var(--muted); cursor: default; }
.bstatus { font-size: 13px; line-height: 1.4; overflow-wrap: anywhere; }
.bstatus.failed { color: var(--bad); }
.boutput { margin: 0; font: 11px/1.4 var(--mono); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; max-height: 260px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text); }
.commit { display: flex; gap: 8px; font-size: 13px; line-height: 1.35; min-width: 0; }
.commit .sha { font-family: var(--mono); color: var(--accent); flex: none; }
.commit .subject { color: var(--text-2); overflow-wrap: anywhere; min-width: 0; }
.more { font-size: 12px; color: var(--muted); }
.foot { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line-soft); padding-top: 8px; }
.quiet { color: var(--muted-2); font-style: italic; border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; }
.bad { color: var(--bad); font-weight: 600; }
.warn { color: var(--warn); font-weight: 600; }

.pinned-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 12px; align-items: start; }
.pinned.compact { padding: 12px 14px; gap: 6px; }
.compact .row1 { align-items: baseline; }
.compact .name { font-size: 14px; white-space: normal; }
.compact .big { font: 500 16px var(--mono); white-space: nowrap; }
.compact .line { font-size: 13px; color: var(--text-3); }
.lanes { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 16px; align-items: start; }
.lane { background: var(--pinned); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.lane-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px; }
.lane-head > div { display: flex; align-items: center; gap: 8px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.lane h2 { margin: 0; font-size: 14px; font-weight: 700; }
.lane .count { font: 13px var(--mono); color: var(--muted); }
.lane .hint, .lane .none { font-size: 12px; color: var(--muted); padding: 0 4px; }
.lcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; gap: 8px; }
.lcard .row1 { align-items: baseline; }
.lcard .name { font-size: 14px; }
.lcard .age { font-size: 12px; color: var(--muted-2); white-space: nowrap; }
.lcard .who { font-size: 13px; color: var(--text-3); }
.lcard .note { font-size: 13px; color: var(--text); }
.lcard .commits { display: flex; flex-direction: column; gap: 3px; border-top: 1px solid var(--line-soft); padding-top: 6px; }
.lcard .commit { font-size: 12px; }
.lcard .pill { align-self: flex-start; font-size: 11px; padding: 2px 8px; }

@media (max-width: 600px) {
  .page { padding: 16px 16px 40px; gap: 16px; }
  .bar { width: 100px; }
}
.load { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 12px; }
.load .label { font-size: 13px; color: var(--muted); }
.load .value { font: 500 13px var(--mono); }
.load svg { display: block; }
.load .spark { fill: none; stroke: var(--accent); stroke-width: 1.5; }
.load .cores { stroke: var(--muted-2); stroke-width: 1; stroke-dasharray: 2 2; }
.load .note { font-size: 12px; color: var(--muted-2); }
.live { font-size: 12px; color: var(--muted-2); }
.live.down { color: var(--bad); font-weight: 600; }
.findings { background: var(--you-bg); color: var(--you); border-radius: 10px; padding: 10px 14px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; overflow-wrap: anywhere; }
.findings .label { font-weight: 700; }
.activity { font-size: 12px; color: var(--working); background: var(--working-bg); border-radius: 6px; padding: 4px 8px; overflow-wrap: anywhere; }

/* The lists sidebar: wide and sticky from 1200px, above the checkouts below it. */
.lists { order: -1; min-width: 0; background: var(--pinned); border: 1px solid var(--pinned-line); border-radius: 14px; padding: 0 12px 12px; max-height: 70vh; overflow: auto; }
@media (min-width: 1200px) {
  .page { grid-template-columns: minmax(0, 1fr) minmax(440px, 40%); gap: 28px; align-items: start; }
  .lists { order: 0; position: sticky; top: 24px; max-height: calc(100vh - 48px); }
}
.l-top { position: sticky; top: 0; z-index: 2; background: var(--pinned); padding: 12px 0 10px; display: flex; flex-direction: column; gap: 10px; }
.l-head { display: flex; align-items: baseline; gap: 10px; }
.l-head h2 { margin: 0; font-size: 16px; font-weight: 700; }
.l-meta { font-size: 12px; color: var(--muted-2); }
.l-tabs { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.6fr) minmax(0, 0.8fr) minmax(0, 1fr); gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.l-tabs[hidden] { display: none; }
.l-tabs button { display: flex; flex-direction: column; align-items: center; gap: 1px; font: 600 13px var(--sans); color: var(--muted); background: transparent; border: 0; border-radius: 7px; padding: 5px 4px; cursor: pointer; min-width: 0; }
.l-tabs button[aria-selected="true"] { background: var(--on); color: var(--on-text); }
.l-tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.l-tabs .l-count { font: 500 10px var(--mono); white-space: nowrap; opacity: 0.85; }
.l-filter input { width: 100%; font: 13px var(--sans); color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
.l-filter input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.l-body { display: flex; flex-direction: column; gap: 16px; }
.l-section { display: flex; flex-direction: column; gap: 8px; }
.l-section > h3 { margin: 0; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; display: flex; gap: 8px; align-items: baseline; }
.l-section > h3 .l-n { font: 500 12px var(--mono); text-transform: none; letter-spacing: 0; }
.l-rows { display: flex; flex-direction: column; gap: 6px; }
.l-card, .l-fold.l-row { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.l-plain { display: flex; flex-direction: column; gap: 8px; }
.l-card { display: flex; flex-direction: column; gap: 8px; }
.l-row1 { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; min-width: 0; }
.l-num { font: 500 13px var(--mono); color: var(--muted-2); }
.l-title { font-size: 14px; font-weight: 600; color: var(--text); overflow-wrap: anywhere; min-width: 0; }
.l-id { font: 12px var(--mono); color: var(--muted-2); }
.l-sub { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.l-fact { font-size: 13px; line-height: 1.4; color: var(--text-2); overflow-wrap: anywhere; }
.l-facts { display: flex; flex-direction: column; gap: 3px; }
.l-fact .k { color: var(--muted); }
.l-fact .mono { font-size: 12px; }
.l-list { margin: 0; padding-left: 18px; font-size: 13px; line-height: 1.4; color: var(--text-2); display: flex; flex-direction: column; gap: 2px; }
.l-fold > summary { font-size: 13px; color: var(--muted); cursor: pointer; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; list-style: none; }
.l-fold > summary::-webkit-details-marker { display: none; }
.l-fold > summary::before { content: "▸"; color: var(--muted-2); font-size: 11px; width: 10px; flex: none; }
.l-fold[open] > summary::before { content: "▾"; }
.l-fold > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.l-fold > summary .l-sub { flex-basis: 100%; padding-left: 18px; }
.l-fold > :not(summary) { margin-top: 8px; }
.l-card > .l-fold { padding: 0; border: 0; background: transparent; }
.l-md { display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.45; color: var(--text-2); overflow-wrap: anywhere; }
.l-md p, .l-md h4 { margin: 0; }
.l-md h4 { font-size: 13px; font-weight: 700; color: var(--text); }
.l-md ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 2px; }
.l-md code, .l-fact code, .l-sub code { font: 12px var(--mono); background: var(--line-soft); border-radius: 4px; padding: 0 4px; }
.l-md strong { color: var(--text); }
a.l-ref { color: var(--accent); text-decoration: underline dotted; text-underline-offset: 2px; cursor: pointer; }
a.l-ref:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
.l-note { background: var(--waiting-bg); border-radius: 8px; padding: 6px 10px; font-size: 13px; line-height: 1.4; color: var(--text-2); overflow-wrap: anywhere; }
.l-flow { display: flex; flex-direction: column; gap: 3px; font-size: 13px; color: var(--text-2); }
.l-flow .k { color: var(--muted); }
.l-empty { font-size: 13px; color: var(--muted); padding: 4px 2px; }
.l-sep { border: 0; border-top: 1px solid var(--line-soft); margin: 2px 0; width: 100%; }
@keyframes l-flash { from { box-shadow: 0 0 0 3px var(--accent); } to { box-shadow: 0 0 0 3px transparent; } }
.l-details { align-self: flex-start; font: 13px var(--sans); color: var(--muted); background: transparent; border: 0; padding: 0; cursor: pointer; display: flex; align-items: baseline; gap: 8px; }
.l-details::before { content: "▸"; color: var(--muted-2); font-size: 11px; width: 10px; flex: none; }
.l-details:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.review { padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--text); width: min(1500px, 96vw); height: 94vh; max-width: none; max-height: none; }
.review[open] { display: flex; flex-direction: column; }
.review::backdrop { background: rgba(0, 0, 0, 0.55); }
.rv-head { display: flex; align-items: baseline; gap: 14px; padding: 8px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
.rv-head .rv-title { font-weight: 600; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.rv-head a { color: var(--accent); }
.rv-head button { font: 13px var(--sans); color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 3px 12px; cursor: pointer; }
.rv-frame { flex: 1; border: 0; width: 100%; min-height: 0; background: var(--surface); }
.hooks { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.hooks > summary { cursor: pointer; font-size: 14px; font-weight: 600; }
.hooks > summary .h-meta { font-weight: 400; color: var(--muted); margin-left: 10px; }
.hooks h3 { margin: 14px 0 6px; font-size: 13px; font-weight: 600; color: var(--text-3); }
.hooks table { border-collapse: collapse; font-size: 12px; width: 100%; }
.hooks th { text-align: left; font-weight: 600; color: var(--muted); padding: 3px 12px 3px 0; }
.hooks td { padding: 3px 12px 3px 0; border-top: 1px solid var(--line-soft); vertical-align: top; }
.hooks td.n, .hooks th.n { text-align: right; font-variant-numeric: tabular-nums; }
.hooks .failed { color: var(--bad); }
.hooks .slower { color: var(--warn); }
.hooks .h-impactform { display: flex; gap: 8px; margin-bottom: 6px; }
.hooks .h-impact { font-size: 12px; }
.hooks .h-impact .h-meta { color: var(--muted); margin: 2px 0; }
.hooks .h-runs { display: flex; flex-direction: column; font-size: 12px; }
.hooks .h-run { border-top: 1px solid var(--line-soft); padding: 4px 0; }
.hooks .h-run > summary { cursor: pointer; display: flex; gap: 14px; flex-wrap: wrap; }
.hooks .h-checks { margin: 4px 0 4px 16px; color: var(--muted); }
.l-flash { animation: l-flash 1.6s ease-out; }
</style>
</head>
<body>
<div class="page">
<div class="left">
<header>
  <div class="title">
    <h1>Builds</h1>
    <span class="sub" id="sub">Worktrees, and the agents working and building in them</span>
  </div>
  <div class="controls">
    <div class="switch" role="group" aria-label="View">
      <button type="button" data-view="repos" aria-pressed="true">By repo</button>
      <button type="button" data-view="lanes" aria-pressed="false">Lanes</button>
    </div>
    <label class="hide-free"><input type="checkbox" id="hide-free"> Hide free worktrees</label>
    <span class="updated" id="hidden-count"></span>
    <div class="queues" id="queues"></div>
    <div class="queues" id="builds"></div>
    <div class="load" id="load"><span class="label">Load</span><span class="note">read while this page is open</span></div>
    <div class="disk" id="disk"><span class="label">Disk</span><span class="floors">reading</span></div>
    <span class="live" id="live">connecting</span>
  </div>
</header>
<div id="findings"></div>
<div id="errors"></div>
<main id="view"><div class="loading">Reading the checkouts</div></main>
<div id="hooks-panels"></div>
</div>
<aside class="lists" id="lists" aria-label="Lists">
  <div class="l-top">
    <div class="l-head"><h2>Lists</h2><span class="l-meta" id="l-meta"></span></div>
    <div class="l-tabs" id="l-tabs" role="tablist" hidden>
      <button type="button" role="tab" data-tab="stack"><span class="l-name">Waiting on you</span><span class="l-count"></span></button>
      <button type="button" role="tab" data-tab="work"><span class="l-name">Work</span><span class="l-count"></span></button>
      <button type="button" role="tab" data-tab="design"><span class="l-name">Design</span><span class="l-count"></span></button>
      <button type="button" role="tab" data-tab="decisions"><span class="l-name">Decisions</span><span class="l-count"></span></button>
    </div>
    <div class="l-filter" id="l-filter" hidden><input type="search" id="l-filter-input" placeholder="Filter decisions by title and body" aria-label="Filter decisions"></div>
  </div>
  <div class="l-body" id="l-body"><div class="l-empty">Reading the lists</div></div>
</aside>
</div>
<dialog class="review" id="review" aria-label="Design change review">
  <div class="rv-head"><span class="rv-title" id="rv-title"></span><a id="rv-open" target="_blank" rel="noopener">Open in its own tab</a><button type="button" id="rv-close">Close</button></div>
  <iframe class="rv-frame" id="rv-frame" title="Design change review"></iframe>
</dialog>
<script>
"use strict";
const SUBTITLE = "Worktrees, and the agents working and building in them";
// The states the daemon derives for each side worktree (worktree_state in
// model.rs), in the order the cards sort.
const STATES = {
  "waiting-on-you": {label: "Waiting on you", cls: "s-you"},
  "ready-to-land": {label: "Ready to land", cls: "s-ready"},
  "winding-down": {label: "Winding down", cls: "s-winding"},
  "working": {label: "Working", cls: "s-working"},
  "held": {label: "Held", cls: "s-winding"},
  "landing": {label: "Landing", cls: "s-free"},
  "free": {label: "Free", cls: "s-free"},
};
const ORDER = Object.keys(STATES);
const LANES = [
  {title: "Waiting on you", hint: "A question only you can answer, or a step only you can do.", dot: "--dot-you", states: ["waiting-on-you"]},
  {title: "Ready to land", hint: "Commits on the branch whose change main doesn’t have yet.", dot: "--dot-ready", states: ["ready-to-land"]},
  {title: "Working", hint: "Claimed, with no commit waiting and nothing asked.", dot: "--dot-working", states: ["winding-down", "working", "held", "landing"]},
  {title: "Free", hint: "Unclaimed worktrees, ready for the next agent.", dot: "--dot-free", states: ["free"]},
];
const VIEW_KEY = "builds-dashboard-view";
const HIDE_FREE_KEY = "builds-dashboard-hide-free";
let state = null, streamError = "";
let view = "repos", hideFree = false;
try {
  const saved = localStorage.getItem(VIEW_KEY);
  if (saved === "repos" || saved === "lanes") view = saved;
  hideFree = localStorage.getItem(HIDE_FREE_KEY) === "true";
} catch (e) { /* no storage: the defaults */ }

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (typeof v === "function") el.addEventListener(k.slice(2), v); else el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(typeof kid === "string" ? document.createTextNode(kid) : kid);
  }
  return el;
}
function size(kib) {
  if (kib === null || kib === undefined) return "-";
  return kib >= 1048576 ? (kib / 1048576).toFixed(1) + "G" : Math.floor(kib / 1024) + "M";
}
function bytes(n) { return size(Math.floor(n / 1024)); }
function wholeSize(kib) { return size(kib).replace(".0G", "G"); }
function ago(epoch) {
  const s = Math.max(0, Date.now() / 1000 - epoch);
  if (s < 60) return Math.round(s) + "s";
  if (s < 3600) return Math.round(s / 60) + "m";
  if (s < 172800) return Math.round(s / 3600) + "h";
  return Math.round(s / 86400) + "d";
}
// A span whose text is "<before><age><after>", kept current by the ticker
// without redrawing its card.
function agoSpan(epoch, before, after, attrs) {
  return h("span", Object.assign({"data-ago": String(epoch), "data-before": before || "", "data-after": after || ""}, attrs || {}),
    (before || "") + ago(epoch) + (after || ""));
}
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function hhmm(d) { return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); }
// A local time as the clock today, "yesterday 22:52" or "Nov 3".
function when(d) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const day = new Date(d); day.setHours(0, 0, 0, 0);
  const days = Math.round((today - day) / 86400000);
  if (days <= 0) return hhmm(d);
  if (days === 1) return "yesterday " + hhmm(d);
  return MONTHS[d.getMonth()] + " " + d.getDate();
}
// A claim's date is local time, "YYYY-MM-DD HH:MM".
function since(text) {
  const t = Date.parse(text.replace(" ", "T"));
  return isNaN(t) ? text : when(new Date(t));
}
function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }
function tilde(path) { return path.replace(/^\/Users\/[^/]+/, "~"); }
// A worktree's last activity: the newer of its HEAD commit and its newest
// uncommitted file, in epoch seconds; 0 when git said nothing.
function activity(c) {
  const g = c.git;
  if (!g || g.error) return 0;
  return Math.max(g.head ? g.head.time : 0, g.last_write || 0);
}
function sideNumber(name) { const m = /(\d+)$/.exec(name); return m ? Number(m[1]) : 0; }
// Most recent activity first.
function byActivity(a, b) { return activity(b) - activity(a) || sideNumber(a.name) - sideNumber(b.name); }
const QUIET_SECONDS = 30 * 60;
// Uncommitted files and no write to them for 30 minutes: an agent that may have stalled.
function quiet(c) {
  const g = c.git;
  return !!(g && !g.error && g.uncommitted && g.last_write && Date.now() / 1000 - g.last_write >= QUIET_SECONDS);
}

// What a checkout's build folders say.
function built(c) {
  if (!c.folders) return null;
  const out = {total: c.total_kib, newest: 0, chips: [], over: [], links: []};
  for (const f of c.folders) {
    if (!f.exists) continue;
    if (f.last_write && f.last_write > out.newest) out.newest = f.last_write;
    const over = f.kib !== null && f.kib > f.cap_kib;
    if (over) out.over.push(f.path + " " + size(f.kib) + " over its " + size(f.cap_kib) + " cap");
    if (f.link !== "linked") out.links.push(f.path + (f.link === "elsewhere" ? " links elsewhere" : " not linked"));
    // A folder under 1M shows as 0M: no build output worth a chip.
    if (f.kib === null || f.kib >= 1024) out.chips.push({path: f.path, kib: f.kib, over});
  }
  out.chips.sort((a, b) => (b.kib || 0) - (a.kib || 0));
  return out;
}

function pill(text, cls) { return h("span", {class: "pill " + cls}, text); }
function stateOf(c) { return STATES[c.state] || {label: c.state, cls: "s-free"}; }
// A lock is per app checkout of an app lane (mac, android): each has its own
// holder. A lane has one queue for all its locks, drawn once for the lane
// (queueMenu) in the toolbar, not on a checkout.
function queueOf(repo, lane) {
  const q = repo.queues.find(x => x.lane === lane);
  return q ? q.queue : [];
}
function lockOf(repo, c) {
  const lock = repo.locks.find(l => l.lane === c.app_lane && l.checkout === c.name);
  return {repo: lock ? lock.repo : repo.name, held: !!(lock && lock.holder), waiting: queueOf(repo, c.app_lane).length,
    holder: lock ? lock.holder : null};
}
// What holds the app lock, each command as its script's file name with the
// whole command in the tooltip.
function shortCommand(command) {
  const words = command.split(/\s+/).filter(Boolean);
  const script = words.find((w, i) => i > 0 && /\.(sh|py|rb|js)$/.test(w));
  const name = (script || words[0] || command).split("/").pop();
  return {name, rest: script ? "" : words.slice(1, 3).join(" ")};
}
function commands(lock) {
  if (!lock.holder) return [];
  const running = lock.holder.running.length ? lock.holder.running : [lock.holder.command];
  return running.map(command => {
    const short = shortCommand(command);
    return h("div", {class: "command", title: command}, (short.name + " " + short.rest).trim());
  });
}
function detachedAt(c) {
  if (c.branch) return c.branch;
  return c.git && c.git.head ? "detached at " + c.git.head.sha : "detached";
}

// The build processes at work in a checkout, as one line.
function activityLine(c) {
  const a = c.activity;
  if (!a || !a.processes.length) return null;
  const counts = {};
  for (const p of a.processes) counts[p.name] = (counts[p.name] || 0) + 1;
  const names = Object.entries(counts).map(([n, k]) => k > 1 ? n + " ×" + k : n).join(", ");
  return h("div", {class: "activity", title: a.processes.map(p => p.name + " " + p.pid).join(", ")},
    "Building: " + names + " · " + Math.round(a.cpu) + "% CPU · " + bytes(a.memory));
}

// Each repo's pinned checkouts (main, then an App build per app lane), its other live
// side worktrees, and the build roots whose checkout is gone.
function split(repo) {
  const main = repo.checkouts.find(c => c.live && c.main);
  // One App build per app lane, mac first.
  const apps = repo.checkouts.filter(c => c.live && c.app_checkout).sort((a, b) => a.app_lane < b.app_lane ? 1 : a.app_lane > b.app_lane ? -1 : a.name < b.name ? -1 : 1);
  const sides = repo.checkouts.filter(c => c.live && !c.main && !c.app_checkout);
  sides.sort((a, b) => ORDER.indexOf(a.state) - ORDER.indexOf(b.state) || byActivity(a, b));
  return {main, apps, sides, gone: repo.checkouts.filter(c => !c.live)};
}
// The side worktrees a view lists: all, or with the Free ones left out.
function shown(sides) { return hideFree ? sides.filter(c => c.state !== "free") : sides; }
function counts(cs) {
  const n = {};
  for (const c of cs) n[c.state] = (n[c.state] || 0) + 1;
  return n;
}

function totalBlock(b) {
  if (!b || b.total === null) return h("div", {class: "total"}, h("span", {class: "of"}, "measuring…"));
  return h("div", {class: "total"}, h("span", {class: "big"}, size(b.total)), h("span", {class: "of"}, "of build output"));
}
// Short names for the build folders; any other shows its path. The chip's
// title holds the path.
const FOLDER_NAMES = {
  "bae-macos/bae/.build": "Xcode build",
  "bae-ios/bae/.build": "iOS Xcode build",
  "bae-android/app/build": "Android app",
  "bae-android/bridge/build": "Android bridge",
  "bae-android/fastvalues/build": "Android fastvalues",
  "bae-android/screensubscription/build": "Android screensubscription",
  "bae-android/.gradle": "Gradle",
  "bae-android/debug-symbols": "Android symbols",
  "BaeKit/Frameworks": "BaeKit",
  "BaeKit/.build": "BaeKit build",
  "bae-avalonia/bin": "Avalonia bin",
  "bae-avalonia/obj": "Avalonia obj",
  "bae-avalonia/bae-avalonia.Tests/bin": "Avalonia tests bin",
  "bae-avalonia/bae-avalonia.Tests/obj": "Avalonia tests obj",
};
function folderName(path) {
  const proof = /^spec\/proofs\/([^/]+)\/\.lake$/.exec(path);
  return FOLDER_NAMES[path] || (proof ? "Lean " + proof[1] + " proofs" : path);
}
// The 3 largest folders inline; the rest behind a disclosure.
const INLINE_CHIPS = 3;
function chips(b) {
  if (!b) return null;
  const chip = f => h("span", {class: "chip" + (f.over ? " over" : ""), title: f.path}, folderName(f.path) + " ",
    h("span", {class: "mono"}, (f.kib === null ? "measuring…" : size(f.kib)) + (f.over ? " over cap" : "")));
  const problems = b.links.map(p => h("span", {class: "chip over"}, p));
  const rest = b.chips.slice(INLINE_CHIPS);
  return [
    b.chips.length || problems.length ? h("div", {class: "chips"}, b.chips.slice(0, INLINE_CHIPS).map(chip), problems) : null,
    rest.length ? h("details", {class: "more-folders"},
      h("summary", {}, "+" + plural(rest.length, "more folder", "more folders")),
      h("div", {class: "chips"}, rest.map(chip))) : null];
}
function mainLine(repo) {
  return "Your checkout. No agent works or builds here.";
}
function appLine(lock, b, appLane) {
  if (lock.held) {
    return "An agent is building here under the " + appLane + " app lock" +
      (lock.holder.minutes ? " (held " + lock.holder.minutes + "m)" : "") +
      (lock.waiting ? "; " + lock.waiting + " waiting for whichever " + appLane + " checkout frees first." : ".");
  }
  return "Where agents build the " + appLane + " app, one at a time under the " + appLane + " app lock." +
    (b && b.newest ? " Last build " + when(new Date(b.newest * 1000)) + "." : "");
}

// Who waits for the app lock, next first, each with the buttons that move it.
function queuedName(q) {
  return q.command.includes("build-app") ? "Your test app" : (q.started_from || "?").split("/").pop();
}
async function queueAction(action, lock, q) {
  try {
    const reply = await fetch("/api/queue", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({action, repo: lock.repo, pid: q.pid})});
    if (!reply.ok) {
      const body = await reply.json().catch(() => ({}));
      throw new Error(body.error || reply.status);
    }
    streamError = "";
  } catch (e) {
    streamError = "queue: " + e.message;
  }
  render();
}
// With every lock of the lane held, a takeover stops the build that joined
// last of the holders (queue.rs); with a lock free it only moves the waiter up.
function takeOver(holders, free, lock, q) {
  if (!free) {
    const names = holders.map(l => shortCommand(l.holder.command).name + " (held " + l.holder.minutes + "m)").join(", ");
    if (!confirm("Every lock is held (" + names + "). Stop the one that started last so " + queuedName(q) +
      " builds now? The stopped build goes straight behind it and runs again by itself.")) return;
  }
  queueAction("takeover", lock, q);
}
// A lane's queue in the toolbar: a count that opens the waiters, each with
// the buttons that move it. The open one survives the page's redraws.
let openQueue = null;
function queueMenu(repo, lane, label, queue) {
  const lock = {repo: repo.name, holder: null};
  const locks = repo.locks.filter(l => l.lane === lane);
  const holders = locks.filter(l => l.holder);
  const free = holders.length < locks.length;
  const el = h("details", {class: "qmenu"},
    h("summary", {}, label + " queue", h("span", {class: "count"}, String(queue.length))),
    h("div", {class: "qpanel"},
      h("span", {class: "label"}, "Waiting for whichever " + lane + " checkout frees first"),
      queue.length ? queue.map((q, i) => h("div", {class: "qrow"},
        h("span", {class: "queued", title: q.command},
          (i + 1) + ". " + queuedName(q) + (q.minutes ? " · " + q.minutes + "m" : "")),
        i > 0 ? h("button", {type: "button", class: "qbtn", onclick: () => queueAction("top", lock, q)}, "Move to top") : null,
        h("button", {type: "button", class: "qbtn danger", onclick: () => takeOver(holders, free, lock, q)}, "Take over")))
        : h("span", {}, "Nothing waiting")));
  const key = repo.name + " " + lane;
  el.open = openQueue === key;
  el.addEventListener("toggle", () => {
    if (el.open) openQueue = key; else if (openQueue === key) openQueue = null;
  });
  return el;
}
function queuesView() {
  const withApps = state.repos.filter(r => r.checkouts.some(c => c.live && c.app_checkout));
  const menus = [];
  for (const repo of withApps) {
    const lanes = [...new Set(split(repo).apps.map(a => a.app_lane))];
    for (const lane of lanes) {
      const name = lane.charAt(0).toUpperCase() + lane.slice(1);
      menus.push(queueMenu(repo, lane, (withApps.length > 1 ? repo.name + " " : "") + name, queueOf(repo, lane)));
    }
  }
  document.getElementById("queues").replaceChildren(...menus);
}

// build-app: a button per repo lane that runs `builds build-app <repo> <lane>
// [<ref>]` in the daemon, and the run it started: queued or running, its
// output as it goes, how it ended. Each lane's panel is made once and
// updated in place, so the ref being typed and the open panel survive the
// page's redraws.
const buildPanels = new Map();
const PHASES = {
  queued: "Queued: waiting for an app lock",
  running: "Running",
  succeeded: "Finished",
  failed: "Failed",
  detached: "Started before the daemon restarted and still running: the dashboard can't see how it ends",
  lost: "The daemon restarted while this ran and the build is gone: how it ended is unknown",
};
function phaseLine(run) {
  let text = PHASES[run.phase] || run.phase;
  if (run.phase === "failed") {
    text += run.signal ? " (signal " + run.signal + ")" : run.exit_code === null ? "" : " (exit " + run.exit_code + ")";
  }
  const at = run.ended_at || run.started_at;
  return text + " · " + (run.ended_at ? "ended " : "started ") + when(new Date(at * 1000)) + (run.ref ? " · " + run.ref : "");
}
async function startBuild(repo, lane, ref) {
  try {
    const reply = await fetch("/api/build-app", {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({repo: repo.name, lane, ref: ref || null})});
    if (!reply.ok) {
      const body = await reply.json().catch(() => ({}));
      throw new Error(body.error || reply.status);
    }
    streamError = "";
  } catch (e) {
    streamError = "build-app: " + e.message;
  }
  render();
}
function buildPanel(repo, lane) {
  const ref = h("input", {type: "text", placeholder: "ref (default origin/main)", "aria-label": "ref to build", spellcheck: "false"});
  const button = h("button", {type: "button", class: "qbtn"}, "Build");
  const status = h("div", {class: "bstatus"});
  const output = h("pre", {class: "boutput"});
  const summary = h("summary", {});
  const el = h("details", {class: "qmenu"}, summary,
    h("div", {class: "qpanel"}, h("span", {class: "label"}, "builds build-app " + repo.name + " " + lane),
      h("div", {class: "bform"}, ref, button), status, output));
  const panel = {el, ref, button, status, output, summary, repo, lane};
  button.addEventListener("click", () => startBuild(panel.repo, lane, ref.value.trim()));
  return panel;
}
function updateBuildPanel(panel, repo, lane, several) {
  panel.repo = repo;
  const run = repo.runs.find(r => r.lane === lane);
  const active = run && ["queued", "running", "detached"].includes(run.phase);
  panel.summary.replaceChildren((several ? repo.name + " " : "") + lane.charAt(0).toUpperCase() + lane.slice(1) + " build-app",
    h("span", {class: "count"}, run ? run.phase : "idle"));
  panel.button.disabled = !!active;
  panel.status.textContent = run ? phaseLine(run) : "No build started from this page.";
  panel.status.className = "bstatus" + (run && (run.phase === "failed" || run.phase === "lost") ? " failed" : "");
  const text = run ? (run.output_cut ? "…\n" : "") + run.output : "";
  panel.output.hidden = !run;
  if (panel.output.textContent !== text) {
    const atEnd = panel.output.scrollTop + panel.output.clientHeight >= panel.output.scrollHeight - 4;
    panel.output.textContent = text;
    if (atEnd) panel.output.scrollTop = panel.output.scrollHeight;
  }
}
function buildsView() {
  const withLanes = state.repos.filter(r => r.lanes.length);
  const els = [];
  for (const repo of withLanes) {
    for (const {lane} of repo.lanes) {
      const key = repo.name + " " + lane;
      if (!buildPanels.has(key)) buildPanels.set(key, buildPanel(repo, lane));
      const panel = buildPanels.get(key);
      updateBuildPanel(panel, repo, lane, withLanes.length > 1);
      els.push(panel.el);
    }
  }
  const box = document.getElementById("builds");
  if (els.length !== box.children.length || els.some((el, i) => box.children[i] !== el)) box.replaceChildren(...els);
}

function pinnedMain(repo, c) {
  const b = built(c);
  return h("article", {class: "pinned"},
    h("div", {class: "row1"},
      h("div", {class: "ident"}, h("span", {class: "name"}, "main"),
        h("span", {class: "where"}, tilde(c.path) + " · " + (c.branch || "detached"))),
      pill("Yours", "s-free")),
    h("span", {class: "line"}, mainLine(repo)),
    activityLine(c),
    totalBlock(b), chips(b));
}
function pinnedApp(repo, c) {
  const b = built(c), lock = lockOf(repo, c);

// Puts <items> ({key, data, make}) in <parent> in order, keeping each
// existing element whose key and data are unchanged and replacing only the
// rest, so an open disclosure or a selection in an unchanged card stays.
function patch(parent, items) {
  const old = new Map();
  for (const el of Array.from(parent.children)) if (el.dataset.key) old.set(el.dataset.key, el);
  let at = 0;
  for (const item of items) {
    const sig = JSON.stringify(item.data);
    let el = old.get(item.key);
    if (!el || el.dataset.sig !== sig) {
      const made = item.make();
      made.dataset.key = item.key;
      made.dataset.sig = sig;
      if (el) {
        const open = new Set(Array.from(el.querySelectorAll("details[open]")).map(d => d.textContent));
        for (const d of made.querySelectorAll("details")) if (open.has(d.textContent)) d.open = true;
      }
      el = made;
    }
    old.delete(item.key);
    if (parent.children[at] !== el) parent.insertBefore(el, parent.children[at] || null);
    at++;
  }
  for (const el of old.values()) el.remove();
  while (parent.children.length > at) parent.lastChild.remove();
}
// The element for <key> in <parent>, made once with <make>.
function slot(parent, key, make) {
  let el = Array.from(parent.children).find(e => e.dataset.key === key);
  if (!el) { el = make(); el.dataset.key = key; parent.append(el); }
  return el;
}

function reposView(root) {
  const items = state.repos.map(repo => ({key: "repo:" + repo.name, data: null, repo}));
  // Sections are kept by repo; their insides are patched below.
  const sections = items.map(item => {
    const repo = item.repo;
    const section = slot(root, item.key, () => h("section", {class: "repo"},
      h("div", {class: "repo-head"}, h("h2", {}, repo.name), h("span", {})),
      h("div", {class: "pinned-grid"}), h("div", {class: "cards"})));
    const {main, apps, sides, gone} = split(repo);
    const agents = sides.filter(c => c.claim && c.state !== "landing").length;
    section.querySelector(".repo-head span").textContent =
      summary([agents ? plural(agents, "agent", "agents") : null, ...stateCounts(sides), goneLine(gone)]) || "no side worktrees";
    const pinned = [];
    if (main) pinned.push({key: "main", data: [repo.lanes, main], make: () => pinnedMain(repo, main)});
    for (const app of apps) pinned.push({key: "app " + app.app_lane + " " + app.name, data: [repo.locks, repo.queues, app], make: () => pinnedApp(repo, app)});

  patch(root, sections.map(s => ({key: s.dataset.key, data: null, make: () => s})));
}

function lanesView(root) {
  const pinned = [], all = [], gone = [];
  for (const repo of state.repos) {
    const s = split(repo);
    if (s.main) pinned.push({key: repo.name + " main", data: [s.main], make: () => compactMain(repo, s.main)});
    for (const app of s.apps) pinned.push({key: repo.name + " app " + app.app_lane + " " + app.name, data: [repo.locks, repo.queues, app], make: () => compactApp(repo, app)});
    for (const c of s.sides) all.push([repo, c]);

  const pinnedRow = slot(root, "pinned", () => h("div", {class: "pinned-row"}));
  patch(pinnedRow, pinned);

  goneEl.textContent = goneLine(gone) || "";
  const lanes = slot(root, "lanes", () => h("div", {class: "lanes"}));
  patch(lanes, LANES.filter(lane => !(hideFree && lane.states.includes("free"))).map(lane => ({
    key: lane.title, data: null, lane,
    make: () => h("section", {class: "lane"},
      h("div", {class: "lane-head"},
        h("div", {}, h("span", {class: "dot", style: "background: var(" + lane.dot + ")"}), h("h2", {}, lane.title)),
        h("span", {class: "count"})),

    if (cards.length) patch(holder, cards.map(([repo, c]) => ({key: repo.name + " " + c.name, data: c, make: () => laneCard(repo, c)})));
    else patch(holder, [{key: "none", data: null, make: () => h("span", {class: "none"}, "None.")}]);
  }
  for (const el of Array.from(root.children)) if (!["pinned", "gone", "lanes"].includes(el.dataset.key)) el.remove();

function disk(v) {
  const gib = k => k / 1048576;
  const scale = Math.max(gib(v.floor_kib) * 2, gib(v.free_kib) * 1.25);
  const pct = x => Math.min(100, 100 * x / scale) + "%";
  let color = "var(--ok)", note = h("span", {class: "floors"}, "warns " + wholeSize(v.floor_kib) + " · stops " + wholeSize(v.hard_floor_kib));
  if (v.free_kib < v.hard_floor_kib) { color = "var(--bad)"; note = h("span", {class: "bad floors"}, "under " + wholeSize(v.hard_floor_kib) + ": builds stop"); }
  else if (v.free_kib < v.floor_kib) { color = "var(--warn)"; note = h("span", {class: "warn floors"}, "under " + wholeSize(v.floor_kib) + ": builds warn · stop at " + wholeSize(v.hard_floor_kib)); }
  return [h("span", {class: "label"}, "Disk"),
    h("div", {class: "bar", role: "img", "aria-label": size(v.free_kib) + " free; builds warn under " + wholeSize(v.floor_kib) + " and stop under " + wholeSize(v.hard_floor_kib)},
      h("span", {class: "fill", style: "width: " + pct(gib(v.free_kib)) + "; background: " + color}),
      h("span", {class: "mark", style: "left: " + pct(gib(v.hard_floor_kib))}),
      h("span", {class: "mark", style: "left: " + pct(gib(v.floor_kib))})),
    h("span", {class: "free"}, size(v.free_kib) + " free"),
    note];
}

// The load: now, and a line of the last ten minutes against the core count.
const SVG = "http://www.w3.org/2000/svg";
function svg(tag, attrs) {
  const el = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  return el;
}
function loadView(load) {
  if (!load) return [h("span", {class: "label"}, "Load"), h("span", {class: "note"}, "reading")];
  const width = 120, height = 24;
  const points = load.history;
  const top = Math.max(load.cores * 1.25, ...points.map(p => p[1]), 1);
  const line = svg("svg", {width: String(width), height: String(height), viewBox: "0 0 " + width + " " + height, role: "img",
    "aria-label": "load over the last ten minutes"});
  const y = v => (height - 1 - (height - 2) * v / top).toFixed(1);
  line.append(svg("line", {class: "cores", x1: "0", x2: String(width), y1: y(load.cores), y2: y(load.cores)}));
  if (points.length > 1) {
    const t0 = points[0][0], span = Math.max(1, points[points.length - 1][0] - t0);
    line.append(svg("polyline", {class: "spark", points: points.map(p => ((p[0] - t0) / span * width).toFixed(1) + "," + y(p[1])).join(" ")}));
  }
  return [h("span", {class: "label"}, "Load"),
    h("span", {class: "value", title: "1, 5 and 15-minute load averages on " + load.cores + " cores"},
      load.now.map(n => n.toFixed(1)).join(" ")),
    line];
}

// A hook run over the limit, as one of the things needing action: the newest
// run of its set of checks stays here until a newer run of that set is under
// the limit (hook_stats.rs), which the `hooks` event carries.
function hookFindings() {
  if (!hooks || hooks.error) return [];
  return hooks.projects.flatMap(p => (p.over_limit || []).map(run => {
    const slowest = run.checks.filter(c => c.ms != null).sort((a, b) => b.ms - a.ms).slice(0, 3).map(c => c.name + " " + secs(c.ms));
    return "commit hook · " + p.project + ": " + secs(run.total_ms) + " in " + run.worktree.split("/").pop() + " (" + (run.branch || "detached") +
      "), over " + secs(p.limit_ms) + " · slowest " + slowest.join(", ") + " · handed " + plural(run.files, "file", "files") + ", " + plural(run.crates, "crate", "crates");
  }));
}

function findingsView(health) {
  const box = document.getElementById("findings");
  const findings = (health ? health.findings : []).concat(hookFindings());
  box.replaceChildren(...(findings.length ? [h("div", {class: "findings"},
    h("span", {class: "label"}, plural(findings.length, "thing needs", "things need") + " acting on"),
    findings.map(f => h("span", {}, f)))] : []));

function render() {
  for (const b of document.querySelectorAll(".switch button")) b.setAttribute("aria-pressed", String(b.dataset.view === view));
  document.getElementById("errors").replaceChildren(...[streamError].filter(Boolean).map(e => h("div", {class: "error"}, e)));
  if (!state) return;
  const sides = state.repos.flatMap(r => split(r).sides);
  const n = counts(sides);
  document.getElementById("hide-free").checked = hideFree;
  document.getElementById("hidden-count").textContent = hideFree && n["free"] ? n["free"] + " free hidden" : "";
  const working = (n["working"] || 0) + (n["winding-down"] || 0);
  document.getElementById("sub").textContent = summary([SUBTITLE,
    working ? working + " working" : null,
    n["ready-to-land"] ? n["ready-to-land"] + " ready to land" : null,
    n["waiting-on-you"] ? n["waiting-on-you"] + " waiting on you" : null]);
  document.getElementById("disk").replaceChildren(...disk(state.volume).filter(Boolean));
  document.getElementById("load").replaceChildren(...loadView(state.load));

// The daemon pushes the whole state when it changes; EventSource reconnects
// by itself after the daemon restarts.
const live = document.getElementById("live");
const events = new EventSource("/events");
events.addEventListener("open", () => { live.textContent = "live"; live.classList.remove("down"); });
events.addEventListener("error", () => { live.textContent = "reconnecting…"; live.classList.add("down"); });
events.addEventListener("state", e => {
  state = JSON.parse(e.data);
  streamError = "";
  live.textContent = "live";
  live.title = "the daemon follows " + state.daemon.entries.toLocaleString() + " files and folders in " + bytes(state.daemon.memory_bytes) + " of memory";
  render();
});
events.addEventListener("failure", e => { streamError = "state: " + JSON.parse(e.data).error; render(); });

const TAB_KEY = "builds-dashboard-lists-tab";
const OPEN_KEY = "builds-dashboard-lists-open";

} catch (e) { /* no storage: the first tab */ }

// A link to a record in the sidebar; text only when the record is not there (closed).
function recLink(id, label) {
  const rec = index.get(id);
  const text = label || "#" + id;
  if (!rec) return document.createTextNode(text);
  return h("a", {class: "l-ref", href: "#" + id, "data-ref": String(id), title: "#" + id + " " + rec.title}, text);
}
// `code`, **bold** and #N, in text.
function inline(text) {
  const out = [];
  const re = /`([^`]+)`|\*\*(.+?)\*\*|(?<![\w&])#(\d+)\b/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    if (m.index > last) out.push(text.slice(last, m.index));
    if (m[1] !== undefined) out.push(h("code", {}, m[1]));
    else if (m[2] !== undefined) out.push(h("strong", {}, inline(m[2])));
    else out.push(recLink(Number(m[3])));
    last = re.lastIndex;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}
// Paragraphs, `-` lists, and `###` headings.
function md(text) {
  const root = h("div", {class: "l-md"});
  let para = [], list = null;
  const endPara = () => { if (para.length) { root.append(h("p", {}, inline(para.join(" ")))); para = []; } };
  const endList = () => { if (list) { root.append(h("ul", {}, list.map(li => h("li", {}, inline(li.join(" ")))))); list = null; } };
  for (const raw of String(text).split("\n")) {
    const line = raw.trimEnd();
    const bullet = /^\s*[-*]\s+(.*)$/.exec(line), head = /^###\s+(.*)$/.exec(line);
    if (!line.trim()) { endPara(); endList(); }
    else if (head) { endPara(); endList(); root.append(h("h4", {}, inline(head[1]))); }
    else if (bullet) { endPara(); (list = list || []).push([bullet[1]]); }
    else if (list && /^\s/.test(line)) list[list.length - 1].push(line.trim());
    else { endList(); para.push(line.trim()); }
  }
  endPara(); endList();
  return root;
}
// A disclosure whose body is made when first opened. <key> keeps it open

function fold(key, id, summaryKids, body, cls) {
  const el = h("details", {class: "l-fold" + (cls ? " " + cls : ""), "data-rec": String(id)}, h("summary", {}, summaryKids));
  let made = false;
  const fill = () => { if (!made) { made = true; el.append(body()); } };
  if (openRecs.has(key)) { el.open = true; fill(); }
  el.addEventListener("toggle", () => {
    if (el.open) { openRecs.add(key); fill(); } else openRecs.delete(key);
    saveOpen();
  });

}

  if (!reply.ok) throw new Error("the daemon answered " + reply.status);
  const body = await reply.json();
  if (!hooks) setHooks(body);
}).catch(() => { /* the `hooks` event shows them once the daemon sends it */ });
setInterval(tick, 1000);
render();
</script>
</body>
