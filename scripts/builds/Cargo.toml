[package]
name = "builds"
version = "0.1.0"
edition = "2024"
publish = false
description = "Owns this machine's build volume: build roots per checkout, caps, the free-space floor, claims, and a daemon with a live page."

[dependencies]
boards = { path = "../boards" }
libc = "0.2.191"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
shots = { path = "../shots" }
toml = "1.1.8"
wait-timeout = "=0.2.1"

[dev-dependencies]
proc-macro2 = "1.0.107"

[build-dependencies]
proc-macro2 = "1.0.107"
sha2 = "0.10"
toml = "1.1.8"

[profile.release]
debug = "line-tables-only"
