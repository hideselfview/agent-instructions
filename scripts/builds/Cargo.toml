[package]
name = "builds"
version = "0.1.0"
edition = "2024"
publish = false
description = "Owns this machine's build volume: build roots per checkout, caps, the free-space floor, claims, and a daemon with a live page."

[dependencies]
libc = "0.2.191"
rusqlite = { version = "0.42.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
debug = "line-tables-only"
