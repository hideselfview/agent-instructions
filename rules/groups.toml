# The groups of rules that `builds review` hands to one reviewer each.
#
# Every rule under rules/ and every rule under projects/*-rules/ is in exactly
# one group (`builds review groups` checks it, and so does builds' test). A
# group runs when at least one of its rules matches a changed path. Its
# reviewer reads the full body of every rule in the group, the project's
# always-loaded instructions (projects/<project>.md), the diff and the
# landing's brief, and answers for every rule.
#
# name        the group's name, as `builds review` prints it
# question    the one design question the group's rules answer
# model       opus or sonnet
# rules       rule slugs (the file names without .md)
# instructions  extra words for the reviewer, optional
# enumerate  true when the reviewer lists every site of the diff that `sites`
#             describes, one changed file per call, and judges each site
#             against every rule of the group (the file's new text around each
#             hunk is in the message)
# sites      what a site is, for an enumerate group: the end of "every site in
#             the diff that ..."
# commit_text true when the commit messages of the change are read as one more
#             file named COMMIT_MESSAGE (an enumerate group)
# passes     how many times each call is made, default 1; the findings of all
#             are kept, and the later calls read the first one's prompt from
#             the cache
# project_facts true when the group also answers for the project facts that
#             every commit keeps (the spec moves with the commit, bae writes as
#             local), as one more verdict named project-facts

[[group]]
name = "Screen reads"
question = "Does each screen show the rows of one plain live SQL query, with nothing in Rust or the app computing what it shows?"
model = "opus"
rules = ["reactive-screens-read-plain-live-queries"]
enumerate = true
passes = 2
sites = "handles rows a query returned, in Rust, Swift or Kotlin: a filter, a pick (first, find, first(where:)), a membership test (contains, isSubset, a Set of ids), a length or emptiness test, a count, a sort, a group, a join, a map that drops rows, or a subscription taken once"

[[group]]
name = "UI views"
question = "Does the UI only list and draw what the core gives it, with the bridge only translating types and fast-changing values drawn by native views?"
model = "sonnet"
rules = [
  "ui-iterates-and-renders-nothing-more",
  "native-views-draw-fast-changing-values",
]

[[group]]
name = "Errors and invalid state"
question = "Does every failure reach someone who can act on it, with no default that hides it, no later pass that repairs invalid state, and each fact checked once where it can become false?"
model = "sonnet"
rules = [
  "never-mask-errors-with-defaults",
  "no-self-heal-make-state-correct-or-fail-loud",
  "report-bugs-without-crashing-crash-only-on-untrustworthy-state",
  "check-a-fact-once-where-it-can-become-false",
]

[[group]]
name = "Necessary code"
question = "Is the change needed today, with no code for a future case, no mechanism that changes no outcome, no special-case UI for an edge case, and every caller of a changed shape updated in the same commit?"
model = "sonnet"
rules = [
  "write-only-what-is-needed-today",
  "change-a-shape-in-one-commit-with-no-compatibility-code",
  "a-mechanism-must-change-an-outcome",
  "settle-edge-cases-from-the-facts-not-with-special-case-ui",
]

[[group]]
name = "Reuse and types"
question = "Does the change reuse existing logic and types, and give fields that are set together a type of their own?"
model = "sonnet"
rules = [
  "reuse-existing-logic-and-types",
  "many-fields-none-together-means-a-missing-type",
]

[[group]]
name = "Modules and calls"
question = "Is the code in its domain's module, and does it get its dependencies from its caller, dispatch on the state it knows, check preconditions where it is called, and fix each bug where the wrong value is made?"
model = "opus"
rules = [
  "organize-code-by-domain",
  "pass-dependencies-down-from-the-top",
  "dispatch-on-known-state-don-t-try-every-case",
  "precondition-gates-belong-at-the-call-site",
  "fix-a-bug-at-its-cause",
]

[[group]]
name = "UI state"
question = "Does each view read its state where it uses it, change observable state through that state's own methods, and keep state that describes what is, not what should happen?"
model = "sonnet"
rules = [
  "a-component-reads-its-state-at-the-leaf",
  "change-observable-state-in-its-own-methods",
  "state-describes-what-is-not-what-should-happen",
]

[[group]]
name = "UI commands, tasks and rows"
question = "Do commands set a value instead of toggling it, do reducers write without reading state, does each task's cancellation follow what starts it, do rows hide views with opacity, and does nothing swizzle or monkeypatch?"
model = "sonnet"
rules = [
  "set-state-don-t-toggle",
  "reducers-must-not-read-state-to-write-state",
  "choose-a-task-s-cancellation-by-what-starts-it",
  "rows-hide-views-with-opacity-not-if",
  "no-swizzling-or-monkeypatching",
]

[[group]]
name = "Timing and tests"
question = "Does code wait on events instead of timers, and does each test run the real code, with animations off and no text recognition?"
model = "sonnet"
rules = [
  "no-timers-in-place-of-knowing",
  "never-re-implement-production-logic-in-tests-mocks-or-previews",
  "tests-capture-views-with-animation-off",
  "no-text-recognition-in-tests",
]

[[group]]
name = "Text people read"
question = "Is every sentence a person reads plain, literal and active, said once, punctuated without dashes, spelled as the product spells its names and translated into every locale, in app strings, notifications, errors, titles, commit messages, docs and code comments?"
model = "opus"
rules = [
  "write-plain-literal-active-sentences",
  "ui-text-says-each-thing-once-in-gentle-plain-words",
  "no-dash-as-sentence-punctuation",
  "localization-stays-in-sync-with-ui",
  "spell-bae-and-disc-id-one-way",
]
enumerate = true
commit_text = true
sites = "is a sentence a person reads: each string, comment, doc comment and documentation sentence the diff adds or changes, and each sentence of the commit messages (the file COMMIT_MESSAGE)"

[[group]]
name = "Screen content"
question = "Does each screen match its board and show only what means something, with no slop chips, decorative icons, music-note imagery, real artist names or components restyled from outside?"
model = "sonnet"
rules = [
  "no-llm-slop-chips",
  "no-decorative-icons-or-emoji",
  "no-music-note-imagery",
  "no-real-artist-album-song-names-in-artifacts",
  "no-restyling-a-component-from-outside",
  "build-each-screen-to-match-its-board",
]

[[group]]
name = "Commits and repo contents"
question = "Does the commit hold only the product and keep the spec current, describe the current state, log through the project's logger, keep the hook to formatting and static checks, add each new dependency at its latest version, and name each file after a type in it?"
model = "sonnet"
rules = [
  "committed-text-describes-the-current-state",
  "use-the-project-s-logger-for-real-logs",
  "the-repo-holds-the-product-not-development-s-ephemera",
  "a-commit-hook-formats-and-statically-checks-what-changed",
  "look-up-the-latest-version-when-adding-a-new-dependency",
  "filename-matches-a-real-type-inside",
]
project_facts = true

[[group]]
name = "visible's rules"
question = "Are visible's bridge types defined in Rust, and does each iOS change have its Android counterpart?"
model = "sonnet"
rules = [
  "bridge-types-defined-in-rust",
  "ios-android-parity",
]
